<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>100 Jumps - Clone Exacto II</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
    #settings-overlay, #settings-overlay *, #stats-overlay, #stats-overlay *{touch-action:pan-y}
    :root{--sat:env(safe-area-inset-top,0px)}
    html,body{width:100%;height:100%;overflow:hidden;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;transition:background .55s ease,color .35s ease;background:#edf2f8}
    #wrap{position:fixed;inset:0;overflow:hidden}
    canvas{display:block;width:100%;height:100%}

    #settings-btn,#stats-btn{position:fixed;top:max(22px,env(safe-area-inset-top,0px)+22px);z-index:99999;width:58px;height:58px;background:#6366f1;border:3px solid #ffffff;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(15,23,42,.28);transition:transform .15s ease,filter .2s ease;color:#fff}
    #settings-btn:hover,#stats-btn:hover{filter:brightness(1.06)}
    #settings-btn{right:16px}
    #theme-btn{display:none}
    #version-footer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);padding:3px 10px;background:rgba(255,255,255,.72);border-radius:10px;font-size:11px;font-weight:600;color:#475569;pointer-events:none;z-index:50}
    #copy-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);padding:8px 14px;border-radius:999px;background:rgba(15,23,42,.88);color:#fff;font-size:13px;font-weight:800;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:100001}
    #copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    body.theme-dark #version-footer{background:rgba(15,23,42,.72);color:#cbd5e1}
    #stats-btn{left:16px}
    #settings-btn:active,#stats-btn:active{transform:scale(.88)}
    #settings-btn .icon,#stats-btn .icon{font-size:28px;line-height:1;display:block;color:#fff}
    body.theme-dark #settings-btn,body.theme-dark #stats-btn{background:#7c83ff;border-color:#e2e8f0}

    #modal,#settings-overlay,#stats-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .28s ease}
    #modal.show,#settings-overlay.show,#stats-overlay.show{opacity:1;pointer-events:auto}

    .card{background:#fff;color:#0f172a;border-radius:24px;border:1px solid rgba(99,102,241,.16);padding:28px 24px 20px;text-align:center;max-width:360px;width:90%;box-shadow:0 28px 60px rgba(15,23,42,.22);transform:translateY(16px) scale(.97);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .35s ease,color .35s ease,border-color .35s ease;position:relative}
    .show .card{transform:translateY(0) scale(1)}
    .card h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:10px}
    .card p{font-size:18px;color:#64748b;margin-bottom:18px}

    .btn{display:block;width:100%;padding:13px 0;border:none;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s ease,filter .2s ease}
    .btn:active{transform:scale(.96)}
    .btn-main{background:#6366f1;color:#fff}
    .btn-soft{margin-top:8px;background:rgba(99,102,241,.12);color:#4f46e5}

    .toggle-row,.select-row,.slider-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
    .toggle-row+.toggle-row,.select-row,.slider-row,.leaderboard{border-top:1px solid #e2e8f0}
    .toggle-label{font-size:14px;font-weight:700;color:#334155}
    .toggle{position:relative;width:48px;height:28px;border-radius:14px;background:#cbd5e1;border:none;cursor:pointer;transition:background .2s}
    .toggle.on{background:#6366f1}
    .toggle:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s}
    .toggle.on:after{transform:translateX(20px)}

    select{font-size:14px;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#334155;max-width:58%}
    .vol-slider{-webkit-appearance:none;appearance:none;width:130px;height:6px;background:#e2e8f0;border-radius:999px}
    .vol-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#6366f1}

    .stats-scroll{max-height:80vh;overflow-y:auto;overflow-x:hidden;text-align:left;max-width:320px;padding-right:4px}
    .stats-scroll *{touch-action:pan-y}
    .stats-scroll::-webkit-scrollbar{width:8px}
    .stats-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
    .stats-section{padding:14px 0;border-bottom:1px solid #e2e8f0}
    .stats-section-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;margin-bottom:10px}
    .stats-grid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat,.stat-item{padding:8px;border-radius:12px;background:#f8fafc;text-align:center}
    .stat .v,.stat-value{font-size:20px;font-weight:900;color:#0f172a}
    .stat .l,.stat-label{font-size:10px;font-weight:700;color:#94a3b8}
    .ach-grid,.trophy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .ach,.trophy-item{padding:10px 4px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;text-align:center}
    .ach.lock,.trophy-item.lock{opacity:.45;filter:grayscale(1)}
    .ach i,.trophy-item i{display:block;font-size:20px;font-style:normal}
    .ach b,.trophy-item b{display:block;font-size:10px;margin-top:4px;line-height:1.2}

    .leaderboard{padding:12px 0}
    .row{display:flex;justify-content:space-between;font-size:12px;color:#475569;padding:3px 0;font-variant-numeric:tabular-nums}
    .stats-actions-bottom{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0}
    body.theme-dark .stats-scroll::-webkit-scrollbar-thumb{background:#475569}

    body.theme-dark{background:#111827}
    body.theme-dark .card{background:#1e293b;color:#f1f5f9;border-color:#334155}
    body.theme-dark .card p,body.theme-dark .toggle-label,.theme-dark .row{color:#94a3b8}
    body.theme-dark .toggle-row+.toggle-row,body.theme-dark .select-row,body.theme-dark .slider-row,body.theme-dark .leaderboard{border-top-color:#334155}
    body.theme-dark .stat{background:#0f172a}
    body.theme-dark .stat .v{color:#f1f5f9}
    body.theme-dark #settings-btn,body.theme-dark #stats-btn{background:rgba(15,23,42,.42)}
    body.theme-dark #settings-btn:hover,body.theme-dark #stats-btn:hover{background:rgba(15,23,42,.62)}
    body.theme-dark #settings-btn svg,body.theme-dark #stats-btn svg{fill:#cbd5e1}
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="gc"></canvas>
  <button id="settings-btn" aria-label="Settings"><span class="icon">âš™ï¸</span></button>
  <button id="theme-btn" aria-label="Toggle Theme" title="Toggle Light/Dark">
    <svg id="icon-sun" viewBox="0 0 24 24" style="display:block" fill="#475569"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000 1.41.996.996 0 001.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06z"/></svg>
    <svg id="icon-moon" viewBox="0 0 24 24" style="display:none" fill="#475569"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
  <button id="stats-btn" aria-label="Stats"><span class="icon">ðŸ†</span></button>

  <div id="settings-overlay"><div class="card">
    <h2>Settings</h2>
    <div class="toggle-row"><span class="toggle-label">Sounds</span><button class="toggle on" id="tog-sound"></button></div>
    <div class="slider-row" id="vol-row"><span class="toggle-label">Volume</span><input class="vol-slider" type="range" id="vol-slider" min="0" max="100" value="80" /></div>
    <div class="toggle-row"><span class="toggle-label">Ambience</span><button class="toggle" id="tog-amb"></button></div>
    <div class="toggle-row"><span class="toggle-label">Particles</span><button class="toggle on" id="tog-particles"></button></div>
    <div class="toggle-row"><span class="toggle-label">Vibration</span><button class="toggle on" id="tog-vib"></button></div>
    <div class="select-row"><span class="toggle-label">Theme</span><select id="theme-select"></select></div>
    <div class="select-row"><span class="toggle-label">Mode</span><select id="mode-select"></select></div>
    <button class="btn btn-main" id="settings-done">Done</button>
  </div></div>

  <div id="stats-overlay"><div class="card stats-scroll">
    <h2 style="margin-bottom:20px;text-align:center">Stats</h2>
    <div class="stats-section">
      <div class="stats-section-title">Current Run</div>
      <div class="stats-grid"><div class="stat-item"><div class="stat-value" id="run-jumps">0</div><div class="stat-label">Jumps</div></div><div class="stat-item"><div class="stat-value" id="run-time">0.0s</div><div class="stat-label">Time</div></div></div>
    </div>
    <div class="stats-section">
      <div class="stats-section-title">Trophies</div>
      <div class="trophy-grid" id="ach-grid"></div>
    </div>
    <div class="stats-section" style="border-bottom:none;padding-bottom:0">
      <div class="stats-section-title">Leaderboard</div>
      <div class="leaderboard" id="lb-list"></div>
    </div>
    <div class="stats-actions-bottom">
      <button class="btn btn-soft" id="share-copy">Copy Leaderboard</button>
      <button class="btn btn-soft" id="share-x">Share on Twitter</button>
      <button class="btn btn-main" id="stats-done">Done</button>
    </div>
  </div></div>

  <div id="modal"><div class="card">
    <h2 id="mt"></h2>
    <p id="ms"></p>
    <button class="btn btn-main" id="mb"></button>
    <button class="btn btn-soft" id="mb-share" style="display:none">Share Result</button>
  </div></div>
</div>
<div id="copy-toast">Copied!</div>
<div id="version-footer">100 Jumps II - v<span id="version-hash">--</span></div>
<button id="settings-float" aria-label="Settings" style="position:fixed;top:max(22px,env(safe-area-inset-top,0px)+22px);right:16px;z-index:999999;width:48px;height:48px;background:transparent;color:#94a3b8;border:none;border-radius:14px;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;">&#9881;</button>
<button id="stats-float" aria-label="Stats" style="position:fixed;top:max(22px,env(safe-area-inset-top,0px)+22px);left:16px;z-index:999999;width:48px;height:48px;background:transparent;color:#94a3b8;border:none;border-radius:14px;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;">&#127942;</button>

<script>
const THEME_PRESETS = {
  light:{bg:'#edf2f8',platform:'#9aa8bd',score:'#23304d',dim:'#94a3b8',perfect:'#24c78b',life:'#ff5b78',char:'#6366f1',pupil:'#312e81'},
  dark:{bg:'#111827',platform:'#4b5563',score:'#e2e8f0',dim:'#64748b',perfect:'#34d399',life:'#fb7185',char:'#7c83ff',pupil:'#000000'},
  neon:{bg:'#05040a',platform:'#6d28d9',score:'#22d3ee',dim:'#a855f7',perfect:'#10f0a0',life:'#ff4d9d',char:'#00e5ff',pupil:'#000000'},
  sunset:{bg:'linear-gradient(180deg,#ff8a5b 0%,#ff4f8b 100%)',platform:'#ffd29a',score:'#fff7ed',dim:'#ffe4e6',perfect:'#fde047',life:'#7f1d1d',char:'#fff4ea',pupil:'#7c2d12'},
  forest:{bg:'#1f3a2b',platform:'#6f4e37',score:'#ecfccb',dim:'#bbf7d0',perfect:'#86efac',life:'#fca5a5',char:'#22c55e',pupil:'#14532d'},
  ocean:{bg:'#0c4a6e',platform:'#0891b2',score:'#e0f2fe',dim:'#7dd3fc',perfect:'#67e8f9',life:'#fda4af',char:'#38bdf8',pupil:'#0f172a'},
  cyberpunk:{bg:'linear-gradient(180deg,#22142f 0%,#3b1f2f 55%,#1a1f2e 100%)',platform:'#7c8aa5',score:'#fde047',dim:'#c084fc',perfect:'#22d3ee',life:'#fb7185',char:'#e879f9',pupil:'#000000'},
  mario:{bg:'linear-gradient(180deg,#5ec6ff 0%,#8ddcff 100%)',platform:'#b56a2d',score:'#ffffff',dim:'#dbeafe',perfect:'#facc15',life:'#ff5b78',char:'#ff4d4d',pupil:'#1f2937'},
  candy:{bg:'linear-gradient(180deg,#ffe4f1 0%,#ffd6e7 55%,#ffeccf 100%)',platform:'#ff4d6d',score:'#a21caf',dim:'#f472b6',perfect:'#22c55e',life:'#ff5b78',char:'#fff6fb',pupil:'#7c2d12'}
};
const MODES = {
  classic:{name:'Classic',target:100,noFail:false,diff:1,timeAttack:false},
  zen:{name:'Zen',target:Infinity,noFail:true,diff:.88,timeAttack:false},
  endless:{name:'Endless',target:Infinity,noFail:false,diff:1,timeAttack:false},
  time:{name:'Time Attack',target:100,noFail:false,diff:1.05,timeAttack:true},
  hardcore:{name:'Hardcore',target:100,noFail:false,diff:1.35,timeAttack:false}
};
const ACH = [
  {id:'first',name:'First Steps',icon:'&#9733;',desc:'Land your first jump'},
  {id:'speedster',name:'Speedster',icon:'&#9889;',desc:'Finish under 60 seconds'},
  {id:'zenMaster',name:'Zen Master',icon:'&#9775;',desc:'Play Zen for 5 minutes'},
  {id:'hardcoreChampion',name:'Hardcore Champion',icon:'&#9670;',desc:'Beat Hardcore mode'},
  {id:'nightOwl',name:'Night Owl',icon:'&#9789;',desc:'Play while using a dark theme'},
  {id:'collector',name:'Collector',icon:'&#9819;',desc:'Use all unlockable themes'},
  {id:'triplePerfect',name:'Triple Perfect',icon:'&#10022;',desc:'3 perfect landings in a row'},
  {id:'airDancer',name:'Air Dancer',icon:'&#8635;',desc:'Stay in air for 2.5s in one jump'},
  {id:'closeCall',name:'Close Call',icon:'&#9711;',desc:'Land near platform edge'},
  {id:'phoenix',name:'Phoenix',icon:'&#9832;',desc:'Recover from 2 fails and still win'},
  {id:'flawless',name:'Flawless',icon:'&#10004;',desc:'Win with no misses'},
  {id:'marathonZen',name:'Cloud Drift',icon:'&#9729;',desc:'Reach 150 jumps in Zen'}
];

const cv = document.getElementById('gc'), ctx = cv.getContext('2d');
let W=0,H=0,S=1;
let state='idle', player, platforms, cam, score, power=0, streak=0, lives=0, particles=[];
let mode='classic', theme='light', failCount=0, firstTs=0, lastTs=0, runEnd=false, jumpRot=0, bounce=0, timeLeft=60;

let settings = {sound:true,vibration:true,volume:.8,ambience:false,particles:false,theme:'light',mode:'classic'};
let stats = {ach:{},leaderboard:{classic:[],zen:[],endless:[],time:[],hardcore:[]},themesUsed:{},all:{attempts:0,wins:0}};
try{Object.assign(settings,JSON.parse(localStorage.getItem('100j2_settings')||'{}'));Object.assign(stats,JSON.parse(localStorage.getItem('100j2_stats')||'{}'));}catch(_){ }
stats.leaderboard=Object.assign({classic:[],zen:[],endless:[],time:[],hardcore:[]},stats.leaderboard||{});
mode=settings.mode; theme=settings.theme;
function save(){localStorage.setItem('100j2_settings',JSON.stringify(settings));localStorage.setItem('100j2_stats',JSON.stringify(stats));}

const ui = {
 modal:document.getElementById('modal'),mt:document.getElementById('mt'),ms:document.getElementById('ms'),mb:document.getElementById('mb'),mbShare:document.getElementById('mb-share'),
 settingsOverlay:document.getElementById('settings-overlay'),statsOverlay:document.getElementById('stats-overlay'),
 togSound:document.getElementById('tog-sound'),togVib:document.getElementById('tog-vib'),togAmb:document.getElementById('tog-amb'),togParticles:document.getElementById('tog-particles'),vol:document.getElementById('vol-slider'),volRow:document.getElementById('vol-row'),
 themeSel:document.getElementById('theme-select'),modeSel:document.getElementById('mode-select'),
 runJumps:document.getElementById('run-jumps'),runTime:document.getElementById('run-time'),achGrid:document.getElementById('ach-grid'),lb:document.getElementById('lb-list')
};
ui.settingsOverlay.querySelector('.card').addEventListener('touchmove', e=>e.stopPropagation(), {passive:true});
ui.statsOverlay.querySelector('.card').addEventListener('touchmove', e=>e.stopPropagation(), {passive:true});

Object.keys(THEME_PRESETS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k[0].toUpperCase()+k.slice(1);ui.themeSel.appendChild(o);});
Object.keys(MODES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=MODES[k].name;ui.modeSel.appendChild(o);});

function applyTheme(name){
  theme=name; settings.theme=name; stats.themesUsed[name]=true;
  const t=THEME_PRESETS[name];
  document.body.style.background = t.bg.startsWith('linear') ? t.bg : t.bg;
  document.body.classList.toggle('theme-dark', ['dark','neon','cyberpunk','ocean','forest'].includes(name));
  save();
  if (['dark','neon','cyberpunk'].includes(name)) unlock('nightOwl');
  if (Object.keys(THEME_PRESETS).every(k=>k==='light'||k==='dark'||stats.themesUsed[k])) unlock('collector');
}

function dprResize(){const r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(Math.min(W,H)/300,1.8)}
function rand(a,b){return a+Math.random()*(b-a)}; function clamp(v,a,b){return Math.max(a,Math.min(b,v))};
const ease = t => 1-Math.pow(1-t,3);

function modeCfg(){return MODES[mode]||MODES.classic}
function targetJumps(){return modeCfg().target}

function reset(){
  dprResize();
  const y=H*.62;
  platforms=[{x:26*S,y,w:110*S,appear:1}]; /* Primera plataforma visible */
  for(let i=1;i<12;i++) platforms.push(gen(platforms[i-1],i));
  player={x:platforms[0].x+platforms[0].w*.35-13*S,y:y-27*S,vx:0,vy:0,idx:0,air:0,jumpStartTime:null};
  cam={x:0,v:0,target:0};
  score={remaining:targetJumps(),cleared:0};
  state='idle';power=0;streak=0;lives=0;particles=[];runEnd=false;firstTs=performance.now();failCount=0;jumpRot=0;bounce=0;timeLeft=mode==='time'?100:60;
  stats.all.attempts++; save();
}

function difficulty(i){
  const d=modeCfg().diff;
  const prog=Math.min(1,i/Math.max(50,targetJumps()===Infinity?120:targetJumps()));
  return {gap:[35+90*prog*d,65+145*prog*d],dy:[-22-36*prog*d,24+32*prog],w:[98-62*prog*d,122-30*prog*d]};
}
function gen(prev,i){
  const d=difficulty(i),dy=rand(d.dy[0],d.dy[1])*S,g=rand(d.gap[0],d.gap[1])*S,w=clamp(rand(d.w[0],d.w[1])*S,26*S,120*S);
  const baseX=prev.x+prev.w+g;
  const p={x:baseX,baseX,y:clamp(prev.y+dy,H*.35,H*.74),w,appear:0,moveAmp:0,moveSpeed:0,movePhase:Math.random()*Math.PI*2}; /* Invisible inicialmente */
  if(mode==='hardcore' && i>0){p.moveAmp=rand(12,28)*S; p.moveSpeed=rand(3.2,5.6);} 
  spawnPlatformFx(p);
  return p;
}
function ensure(){const edge=cam.x+W+420*S; while(platforms[platforms.length-1].x<edge) platforms.push(gen(platforms[platforms.length-1],platforms.length));}

function setCamTarget(){ const c=platforms[player.idx],n=platforms[player.idx+1]||c; cam.target=((c.x+n.x+n.w)/2)-W/2; }

let audioCtx, ambNode;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}} if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); updateAmbience();}
function tone(f,t,d,v,del=0,type='sine'){if(!settings.sound||!audioCtx)return;const st=audioCtx.currentTime+del,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,st);if(t) o.frequency.exponentialRampToValueAtTime(t,st+d*.8);g.gain.setValueAtTime(v*settings.volume,st);g.gain.exponentialRampToValueAtTime(.001,st+d);o.connect(g);g.connect(audioCtx.destination);o.start(st);o.stop(st+d+.02)}
function sfxJump(){if(settings.vibration&&navigator.vibrate)navigator.vibrate(6);tone(180,220,.12,.15,0,'sine');tone(360,320,.14,.1,.02,'sine');}
function sfxLand(dist){const p=clamp(1-dist/(170*S),.55,1.3); tone(180*p,80*p,.11,.28,0,'triangle');}
function sfxPerfect(){[660,880,1100].forEach((n,i)=>tone(n,null,.24,.24-i*.05,i*.06,'sine'))}
function sfxWin(){[523,659,784,1047].forEach((n,i)=>{tone(n,null,.55,.25,i*.11,'triangle');tone(n*2,null,.45,.12,i*.11,'sine')})}
function sfxLose(){tone(380,200,.22,.26);tone(220,130,.3,.2,.15,'triangle')}
function updateAmbience(){if(!audioCtx)return; if(settings.ambience&&settings.sound){if(!ambNode){ambNode=audioCtx.createOscillator();const g=audioCtx.createGain();ambNode.type='sine';ambNode.frequency.value=58;g.gain.value=.02*settings.volume;ambNode.connect(g);g.connect(audioCtx.destination);ambNode._g=g;ambNode.start();} ambNode._g.gain.setTargetAtTime(.02*settings.volume,audioCtx.currentTime,.2);} else if(ambNode){ambNode._g.gain.setTargetAtTime(.0001,audioCtx.currentTime,.2);} }

function unlock(id){if(stats.ach[id])return;stats.ach[id]=Date.now();save();}
function addLeaderboard(win){const arr=stats.leaderboard[mode]||[];arr.push({t:Date.now(),j:score.cleared,time:((performance.now()-firstTs)/1000),a:stats.all.attempts,win});arr.sort((a,b)=> (b.j-a.j) || (a.time-b.time));stats.leaderboard[mode]=arr.slice(0,10);save();}
function shareText(){const t=((performance.now()-firstTs)/1000).toFixed(1);return `I scored ${score.cleared} jumps in 100 Jumps II (${MODES[mode].name}) in ${t}s. 🎮 #100Jumps #100JumpsChallenge #100JumpsEndless`}
function leaderboardText(){const lb=stats.leaderboard[mode]||[]; const title=`100 Jumps II - ${MODES[mode].name} Leaderboard`; const tags='🎮 #100Jumps #100JumpsChallenge #100JumpsEndless'; if(!lb.length)return `${title}
No scores yet.

${tags}`; return [title,...lb.map((r,i)=>`#${i+1} ${r.j} jumps - ${r.time.toFixed(1)}s - ${new Date(r.t).toLocaleDateString()}`),'',tags].join('\n')}
let copyToastTimer=0;
function showCopyToast(){const el=document.getElementById('copy-toast'); if(!el)return; el.classList.add('show'); clearTimeout(copyToastTimer); copyToastTimer=setTimeout(()=>el.classList.remove('show'),1100)}
async function copyShare(){try{await navigator.clipboard.writeText(shareText());showCopyToast();}catch(_){}}
async function copyLeaderboard(){try{await navigator.clipboard.writeText(leaderboardText());showCopyToast();}catch(_){}}
function twitterShare(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText()),'_blank')}
function spawn(type,x,y,cnt,col){for(let i=0;i<cnt;i++)particles.push({type,x,y,vx:rand(-150,150)*S,vy:rand(-240,10)*S,life:rand(.35,1.2),age:0,size:rand(2,6)*S,c:col||'#fff'})}
function spawnTrail(){if(!settings.particles)return;const cx=player.x+13*S-cam.x,cy=player.y+27*S;particles.push({type:'trail',x:cx,y:cy,vx:rand(-20,20)*S,vy:rand(15,70)*S,life:.25,age:0,size:rand(2,4)*S,c:THEME_PRESETS[theme].char})}
function spawnPerfect(x,y){if(!settings.particles)return;spawn('spark',x-cam.x,y,20,THEME_PRESETS[theme].perfect)}
function spawnDust(x,y,color){if(!settings.particles)return;spawn('dust',x-cam.x,y,14,color||THEME_PRESETS[theme].platform)}
function spawnConfetti(x,y){if(!settings.particles)return;for(let i=0;i<90;i++)particles.push({type:'conf',x:x-cam.x,y,vx:rand(-220,220)*S,vy:rand(-320,-80)*S,life:rand(.8,1.8),age:0,size:rand(2,6)*S,c:['#f43f5e','#22d3ee','#eab308','#a855f7','#34d399'][Math.floor(Math.random()*5)]})}
function spawnPlatformFx(p){if(!settings.particles)return;for(let i=0;i<8;i++)particles.push({type:'appear',x:p.x+rand(0,p.w),y:p.y,vx:rand(-20,20)*S,vy:rand(-40,0)*S,life:.45,age:0,size:rand(1,3)*S,c:THEME_PRESETS[theme].dim,world:true})}

// Texto flotante "Perfect!"
let floatTexts=[];
function addFloatText(text,x,y,color,size){
  floatTexts.push({text,x,y,color,size,age:0,life:1.5,vx:0,vy:-30*S});
}
function drawFloatTexts(){
  for(let i=floatTexts.length-1;i>=0;i--){
    const f=floatTexts[i];
    f.age+=0.016;
    f.x+=f.vx*0.016;
    f.y+=f.vy*0.016;
    if(f.age>=f.life){floatTexts.splice(i,1);continue;}
    const a=1-f.age/f.life;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle=f.color;
    ctx.font=`800 ${f.size*S}px system-ui`;
    ctx.textAlign='center';
    ctx.fillText(f.text,f.x-cam.x,f.y);
    ctx.restore();
  }
}

function down(e){e.preventDefault();initAudio(); if(ui.modal.classList.contains('show')||ui.settingsOverlay.classList.contains('show')||ui.statsOverlay.classList.contains('show')) return; if(state==='idle'){state='charging';power=0}else if(state==='jumping'||state==='falling'){}}
function up(e){e.preventDefault(); if(state!=='charging')return; sfxJump();const p=Math.max(.07,power)*0.55; player.vx=(230+380*p)*S; player.vy=-(250+820*p)*S; state='jumping'; power=0; player.air=0; player.jumpStartTime=performance.now(); if(settings.vibration&&navigator.vibrate)navigator.vibrate(8)}

function update(dt){
  if(dt>.1)dt=.1;
  if(mode==='time' && !runEnd){
    timeLeft -= dt;
    if(timeLeft<=0){timeLeft=0; endRun(false); return;}
  }
  if(state==='charging') power=Math.min(1,power+dt/1.1);
  if(state==='jumping'||state==='falling'){
    player.air += dt;
    player.vy += 2200*S*dt; player.x += player.vx*dt; player.y += player.vy*dt;
    // Rotacion continua a velocidad x1 (420 deg/s)
    jumpRot += dt*840;
    spawnTrail();
    const cw=27*S,ch=27*S,b=player.y+ch,pb=b-player.vy*dt,cx=player.x+cw/2;
    if(player.vy>0){
      const tol=Math.max(Math.abs(player.vy*dt),8*S);
      const cp=platforms[player.idx];
      if(cp && cx>=cp.x&&cx<=cp.x+cp.w && pb<=cp.y+2*S && b>=cp.y-2*S && b<=cp.y+tol){
        player.vx=0; player.vy=0; player.y=cp.y-27*S; state='idle'; jumpRot=0; bounce=1;
        return;
      }
      const ni=player.idx+1,np=platforms[ni];
      if(np && cx>=np.x&&cx<=np.x+np.w && pb<=np.y+2*S && b>=np.y-2*S && b<=np.y+tol){onLand(np,ni,cx); return;}
    }
    if(b>H+90*S){
      if(modeCfg().noFail){if(mode==='zen'&&score.cleared>0)addLeaderboard(false); const cp=platforms[player.idx]; player.x=cp.x+cp.w*.35-13*S; player.y=cp.y-27*S; player.vx=player.vy=0; state='idle'; spawnDust(player.x+13*S,player.y+27*S,THEME_PRESETS[theme].platform);}
      else if(lives>0){
        lives--; failCount++; sfxLose(); streak=0; // Reset Perfects al caer
        // Texto "-1 LIFE" en rojo
        addFloatText('-1 LIFE', player.x+13*S, player.y-40*S, '#ff5b78', 18);
        const cp=platforms[player.idx]; player.x=cp.x+cp.w*.35-13*S; player.y=cp.y-27*S; player.vx=player.vy=0; state='idle';
      }
      else {endRun(false);}
    }
  }

  setCamTarget();
  const spring=11,damp=8; const force=(cam.target-cam.x)*spring - cam.v*damp; cam.v += force*dt; cam.x += cam.v*dt;

  if(bounce>0) bounce=Math.max(0,bounce-dt*5);

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type!=='trail'&&p.type!=='appear')p.vy+=540*S*dt;}

  for(let i=Math.max(0,player.idx-1);i<platforms.length;i++){
    const p=platforms[i];
    if(p.appear<1) p.appear=Math.min(1,p.appear+dt*4);
    if(mode==='hardcore' && p.moveAmp>0){
      const prog = Math.min(1, score.cleared / 50);
      const speedMul = 1 + prog * 0.75;
      p.x = p.baseX + Math.sin((performance.now()/1000)*(p.moveSpeed*speedMul) + p.movePhase) * p.moveAmp;
    }
  }
  ensure();

  if(mode==='zen'){
    const sec=(performance.now()-firstTs)/1000;
    if(sec>=300) unlock('zenMaster');
    if(score.cleared>=150) unlock('marathonZen');
  }
}

function onLand(plat,idx,cx){
  const old=player.idx; player.idx=idx; player.vx=player.vy=0; player.y=plat.y-27*S; state='idle'; jumpRot=0; bounce=1;
  plat.moveAmp=0; plat.moveSpeed=0; plat.baseX=plat.x;
  const pc=plat.x+plat.w/2,dist=Math.abs(cx-pc),perfect=dist<=plat.w*.11;
  score.cleared += (idx-old); if(targetJumps()!==Infinity) score.remaining=Math.max(0,targetJumps()-score.cleared);
  if(score.cleared===1) unlock('first');
  if(player.air>=2.5) unlock('airDancer');
  if(Math.min(cx-plat.x,plat.x+plat.w-cx)<plat.w*.08){unlock('closeCall');}

  sfxLand(dist);
  if(perfect){
    streak++; spawnPerfect(cx,plat.y); sfxPerfect(); 
    if(mode==='time'){const bonus=streak; timeLeft += bonus; addFloatText(`+${bonus}s`, cx, plat.y - 58*S, THEME_PRESETS[theme].perfect, 15);}
    // Texto "Perfect!" flotante con color del theme
    addFloatText('Perfect!', cx, plat.y - 40*S, THEME_PRESETS[theme].perfect, 16);
    if(streak>=3) unlock('triplePerfect');
    // Cada 3 perfectos consecutivos = vida extra
    if(streak % 3 === 0) {
      lives++;
      addFloatText('+1 LIFE', cx, plat.y - 60*S, '#ff5b78', 14);
    }
  }
  else {streak=0; spawnDust(cx,plat.y+2*S,THEME_PRESETS[theme].platform);}

  if(modeCfg().target!==Infinity && score.cleared>=modeCfg().target){endRun(true);}
}

function endRun(win){
  if(runEnd) return; runEnd=true;
  const sec=(performance.now()-firstTs)/1000;
  if(win){
    stats.all.wins++; if(sec<60) unlock('speedster'); if(mode==='hardcore') unlock('hardcoreChampion'); if(failCount===0) unlock('flawless'); if(failCount>=2) unlock('phoenix');
    sfxWin(); spawnConfetti(player.x+13*S,player.y);
    ui.mt.textContent='Victory!';
    ui.ms.textContent = mode==='time' ? `Time Attack complete in ${sec.toFixed(2)}s` : `${score.cleared} jumps complete in ${sec.toFixed(1)}s`;
    ui.mb.textContent='Play Again';
  } else {
    ui.mt.textContent='Game Over'; ui.ms.textContent=`You reached ${score.cleared} jumps`; ui.mb.textContent='Retry';
  }
  addLeaderboard(win);
  ui.mb.onclick=()=>{ui.modal.classList.remove('show');reset();};
  ui.mbShare.style.display='block'; ui.mbShare.onclick=copyShare;
  ui.modal.classList.add('show');
  save();
}

function drawBg(){
  const t=THEME_PRESETS[theme];
  if(t.bg.startsWith('linear')){const g=ctx.createLinearGradient(0,0,0,H); const cols=[...t.bg.matchAll(/#[0-9a-fA-F]{6}/g)].map(m=>m[0]); if(cols.length>=2){g.addColorStop(0,cols[0]); if(cols.length===2){g.addColorStop(1,cols[1]);} else {g.addColorStop(.55,cols[1]); g.addColorStop(1,cols[2]);}} ctx.fillStyle=g;}
  else {ctx.fillStyle=t.bg;}
  ctx.fillRect(0,0,W,H);
  if(theme==='sunset'){
    const sunX=W*.78,sunY=H*.24,sunR=42*S;
    const sg=ctx.createRadialGradient(sunX,sunY,sunR*.15,sunX,sunY,sunR*1.9);
    sg.addColorStop(0,'rgba(255,241,186,.98)');
    sg.addColorStop(.35,'rgba(255,188,92,.95)');
    sg.addColorStop(.68,'rgba(255,128,58,.52)');
    sg.addColorStop(1,'rgba(255,128,58,0)');
    ctx.fillStyle=sg;
    ctx.beginPath();
    ctx.arc(sunX,sunY,sunR*1.9,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#ff9f43';
    ctx.beginPath();
    ctx.arc(sunX,sunY,sunR,0,Math.PI*2);
    ctx.fill();
    const haze=ctx.createLinearGradient(0,H*.45,0,H);
    haze.addColorStop(0,'rgba(255,181,102,0)');
    haze.addColorStop(1,'rgba(255,214,160,.18)');
    ctx.fillStyle=haze;
    ctx.fillRect(0,0,W,H);
  }
  if(theme==='neon'){
    const tm=performance.now()/1000;
    for(let i=0;i<4;i++){
      const gx=W*(.18+i*.22), gy=H*(.16+(i%2)*.22);
      const rg=ctx.createRadialGradient(gx,gy,8*S,gx,gy,70*S);
      rg.addColorStop(0,i%2===0?'rgba(34,211,238,.20)':'rgba(244,63,94,.16)');
      rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.arc(gx,gy,70*S,0,Math.PI*2);
      ctx.fill();
    }
    ctx.strokeStyle='rgba(34,211,238,.16)';
    ctx.lineWidth=1*S;
    for(let y=0;y<=H;y+=28*S){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    for(let x=0;x<=W;x+=28*S){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    ctx.strokeStyle='rgba(168,85,247,.28)';
    ctx.lineWidth=2*S;
    for(let i=0;i<3;i++){
      const y=H*(.28+i*.18);
      ctx.beginPath();
      for(let x=0;x<=W+20;x+=20){
        const yy=y+Math.sin((x/W)*Math.PI*4+tm*1.8+i)*6*S;
        if(x===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
  }
  if(theme==='mario'){
    ctx.fillStyle='#ffffff';
    const cloudStep=170*S, parallax=0.2;
    for(let i=-2;i<=6;i++){
      const seed=Math.abs(Math.sin((i+3)*12.9898))*43758.5453;
      const baseX=i*cloudStep + ((seed%1)*70-35)*S;
      const sx=((baseX-cam.x*parallax)%(W+cloudStep)+(W+cloudStep))%(W+cloudStep)-cloudStep*.35;
      const sy=(42 + ((seed*1.7)%1)*78)*S;
      const cw=(46 + ((seed*2.3)%1)*18)*S;
      const ch=(16 + ((seed*3.1)%1)*6)*S;
      ctx.beginPath();
      ctx.ellipse(sx,sy,cw*.34,ch*.36,0,0,Math.PI*2);
      ctx.ellipse(sx+cw*.24,sy-5*S,cw*.26,ch*.28,0,0,Math.PI*2);
      ctx.ellipse(sx+cw*.5,sy+1*S,cw*.28,ch*.3,0,0,Math.PI*2);
      ctx.fill();
    }
    const hillBase=H-18*S;
    for(const h of [{x:35,w:92,h:42,c:'#62b84d'},{x:118,w:56,h:26,c:'#79cd5a'},{x:292,w:110,h:52,c:'#62b84d'},{x:360,w:64,h:30,c:'#79cd5a'}]){
      ctx.fillStyle=h.c;
      ctx.beginPath();
      ctx.moveTo(h.x*S,hillBase);
      ctx.quadraticCurveTo((h.x+h.w*.5)*S,hillBase-h.h*S,(h.x+h.w)*S,hillBase);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle='#2f9e44';
    ctx.fillRect(0,H-18*S,W,18*S);
    ctx.fillStyle='#1f7a32';
    for(let x=0;x<W+20*S;x+=22*S)ctx.fillRect(x,H-18*S,12*S,4*S);
  }
  if(theme==='cyberpunk'){
    const tm=performance.now()/1000;
    ctx.fillStyle='rgba(8,10,18,.18)';
    for(let i=0;i<5;i++){
      const by=H*(.18+i*.16);
      ctx.fillRect(0,by,W,2*S);
    }
    const towers=[{x:.08,w:.12,h:.34},{x:.24,w:.1,h:.46},{x:.42,w:.14,h:.38},{x:.66,w:.12,h:.52},{x:.83,w:.1,h:.3}];
    for(const t of towers){
      const x=W*t.x,w=W*t.w,hb=H*t.h;
      ctx.fillStyle='rgba(15,23,42,.36)';
      ctx.fillRect(x,H-hb,w,hb);
      ctx.fillStyle='rgba(250,204,21,.16)';
      for(let yy=H-hb+12*S;yy<H-10*S;yy+=14*S){
        for(let xx=x+6*S;xx<x+w-6*S;xx+=12*S)ctx.fillRect(xx,yy,4*S,6*S);
      }
    }
    const pipes=[{y:.26,stroke:'rgba(34,211,238,.45)'},{y:.48,stroke:'rgba(244,63,94,.35)'},{y:.68,stroke:'rgba(245,158,11,.32)'}];
    for(const p of pipes){
      const y=H*p.y + Math.sin(tm*1.2+p.y*10)*3*S;
      ctx.strokeStyle=p.stroke;
      ctx.lineWidth=3*S;
      ctx.beginPath();
      ctx.moveTo(-10*S,y);
      ctx.lineTo(W*.2,y);
      ctx.lineTo(W*.27,y-12*S);
      ctx.lineTo(W*.5,y-12*S);
      ctx.lineTo(W*.58,y+6*S);
      ctx.lineTo(W+10*S,y+6*S);
      ctx.stroke();
    }
    const gears=[{x:86,y:104,r:16},{x:336,y:120,r:24},{x:260,y:228,r:18}];
    for(const g of gears){
      const gx=g.x*S,gy=g.y*S,r=g.r*S,rot=tm*.28+g.r;
      ctx.save();
      ctx.translate(gx,gy);
      ctx.rotate(rot);
      ctx.strokeStyle='rgba(148,163,184,.22)';
      ctx.lineWidth=2*S;
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=i*Math.PI/5;
        ctx.moveTo(Math.cos(a)*r*.74,Math.sin(a)*r*.74);
        ctx.lineTo(Math.cos(a)*r*1.02,Math.sin(a)*r*1.02);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,r*.74,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,r*.22,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
  if(theme==='candy'){
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(const c of [{x:70,y:120,w:90,h:28},{x:310,y:170,w:110,h:34},{x:220,y:90,w:70,h:22}]){ctx.beginPath();ctx.ellipse(c.x*S,c.y*S,c.w*S*.35,c.h*S*.35,0,0,Math.PI*2);ctx.ellipse((c.x+24)*S,(c.y-8)*S,c.w*S*.28,c.h*S*.3,0,0,Math.PI*2);ctx.ellipse((c.x+46)*S,(c.y+2)*S,c.w*S*.3,c.h*S*.32,0,0,Math.PI*2);ctx.fill();}
  }
  if(theme==='ocean'){
    const tm=performance.now()/1000;
    ctx.strokeStyle='rgba(255,255,255,.14)';
    ctx.lineWidth=3*S;
    for(let row=0; row<3; row++){
      const y=H*(0.22 + row*0.18);
      ctx.beginPath();
      for(let x=0; x<=W+20; x+=20){
        const yy = y + Math.sin((x/W)*Math.PI*4 + tm*1.4 + row)*8*S;
        if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    for(let i=0;i<14;i++){
      const bx=((i*83)+(tm*(18+i*2))*20)%(W+60)-30;
      const by=H-(((tm*(22+i*1.7)*12)+(i*57))%(H+80))+20;
      const br=(2+(i%4))*S;
      ctx.strokeStyle='rgba(255,255,255,.22)';
      ctx.lineWidth=1.2*S;
      ctx.beginPath();
      ctx.arc(bx,by,br,0,Math.PI*2);
      ctx.stroke();
    }
  }
  if(theme==='forest'){
    ctx.fillStyle='rgba(14,40,24,.28)';
    for(let i=0;i<6;i++){
      const tx=(i*90%W);
      const th=(90+((i*23)%70))*S;
      ctx.fillRect(tx,H-th,14*S,th);
      ctx.beginPath();
      ctx.moveTo(tx-18*S,H-th+20*S); ctx.lineTo(tx+7*S,H-th-16*S); ctx.lineTo(tx+32*S,H-th+20*S); ctx.closePath();
      ctx.moveTo(tx-14*S,H-th+40*S); ctx.lineTo(tx+7*S,H-th+8*S); ctx.lineTo(tx+28*S,H-th+40*S); ctx.closePath();
      ctx.fill();
    }
    const tm=performance.now()/1000;
    ctx.fillStyle='rgba(187,247,208,.22)';
    for(let i=0;i<14;i++){
      const fall=((tm*(10+i*0.35))*12 + i*41)%(H+80)-30;
      const sway=Math.sin(tm*(1.4+i*0.08)+i)*18*S;
      const drift=Math.sin(tm*(2.2+i*0.11)+i*0.7)*8*S;
      const lx=((i*67)+sway+drift)%(W+120)-40;
      const ly=fall;
      ctx.save();
      ctx.translate(lx,ly);
      ctx.rotate(Math.sin(tm*(2.6+i*0.09)+i)*0.9 + Math.sin(tm*(1.3+i*0.05))*0.25);
      ctx.beginPath();
      ctx.ellipse(0,0,5*S,2.5*S,0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='rgba(20,83,45,.22)';
      ctx.lineWidth=.7*S;
      ctx.beginPath();
      ctx.moveTo(-3*S,0);
      ctx.lineTo(3*S,0);
      ctx.stroke();
      ctx.restore();
    }
  }
}
function drawPlat(p){const x=p.x-cam.x,y=p.y,w=p.w,h=8*S;if(x+w<-30||x>W+30)return; const a=ease(p.appear); ctx.globalAlpha=a; rr(ctx,x,y,w,h,4*S); if(theme==='candy'){ctx.save(); ctx.clip(); const stripe=8*S; for(let i=-h-w;i<w+h*2;i+=stripe*2){ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(x+i,y+h); ctx.lineTo(x+i+stripe,y+h); ctx.lineTo(x+i+stripe+h,y); ctx.lineTo(x+i+h,y); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ff5a76'; ctx.beginPath(); ctx.moveTo(x+i+stripe,y+h); ctx.lineTo(x+i+stripe*2,y+h); ctx.lineTo(x+i+stripe*2+h,y); ctx.lineTo(x+i+stripe+h,y); ctx.closePath(); ctx.fill(); } ctx.restore(); ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.5*S; rr(ctx,x,y,w,h,4*S); ctx.stroke(); } else if(theme==='neon'){ctx.fillStyle='rgba(19,10,34,.92)'; ctx.fill(); ctx.strokeStyle='#22d3ee'; ctx.shadowColor='#22d3ee'; ctx.shadowBlur=12*S; ctx.lineWidth=1.8*S; rr(ctx,x,y,w,h,4*S); ctx.stroke(); ctx.shadowBlur=0; ctx.strokeStyle='rgba(244,77,157,.75)'; ctx.lineWidth=1*S; ctx.beginPath(); ctx.moveTo(x+8*S,y+h/2); ctx.lineTo(x+w-8*S,y+h/2); ctx.stroke(); } else if(theme==='cyberpunk'){const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,'#9ca3af'); g.addColorStop(.45,'#6b7280'); g.addColorStop(1,'#374151'); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='rgba(15,23,42,.7)'; ctx.lineWidth=1.2*S; rr(ctx,x,y,w,h,4*S); ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=.9*S; ctx.beginPath(); ctx.moveTo(x+5*S,y+2*S); ctx.lineTo(x+w-5*S,y+2*S); ctx.stroke(); for(let lx=x+10*S; lx<x+w-8*S; lx+=14*S){ctx.fillStyle='rgba(17,24,39,.58)'; ctx.fillRect(lx,y+2*S,2.4*S,h-4*S);} for(let rx=x+8*S; rx<x+w-8*S; rx+=18*S){ctx.fillStyle='#f59e0b'; ctx.beginPath(); ctx.arc(rx,y+h/2,1.1*S,0,Math.PI*2); ctx.fill();} ctx.fillStyle='rgba(34,211,238,.18)'; ctx.fillRect(x+4*S,y+h-2.2*S,w-8*S,1.2*S); } else if(theme==='mario'){ctx.fillStyle='#b56a2d'; ctx.fill(); ctx.save(); ctx.clip(); ctx.strokeStyle='rgba(102,45,15,.8)'; ctx.lineWidth=1*S; ctx.beginPath(); ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2); ctx.stroke(); for(let bx=x+14*S;bx<x+w;bx+=18*S){ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx,y+h/2); ctx.stroke();} for(let bx=x+5*S;bx<x+w;bx+=18*S){ctx.beginPath(); ctx.moveTo(bx,y+h/2); ctx.lineTo(bx,y+h); ctx.stroke();} ctx.restore(); ctx.strokeStyle='#7c3412'; ctx.lineWidth=1.2*S; rr(ctx,x,y,w,h,4*S); ctx.stroke(); } else if(theme==='forest'){ctx.fillStyle=THEME_PRESETS[theme].platform; ctx.fill(); ctx.strokeStyle='rgba(89,58,32,.65)'; ctx.lineWidth=1.2*S; for(let lx=x+8*S; lx<x+w-6*S; lx+=10*S){ctx.beginPath(); ctx.moveTo(lx,y+1*S); ctx.lineTo(lx+rand(-1,1)*S,y+h-1*S); ctx.stroke();} ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(x+4*S,y+2*S); ctx.lineTo(x+w-4*S,y+2*S); ctx.stroke(); } else if(theme==='sunset'){ctx.fillStyle=THEME_PRESETS[theme].platform; ctx.fill(); ctx.save(); ctx.clip(); for(let i=0;i<28;i++){ctx.fillStyle=i%3===0?'rgba(255,244,210,.34)':(i%3===1?'rgba(255,222,168,.22)':'rgba(230,176,96,.18)'); ctx.beginPath(); ctx.arc(x+6*S+(i*13*S)%w,y+2*S+((i*7)%5)*1.1*S,.8*S+(i%3)*.45*S,0,Math.PI*2); ctx.fill();} ctx.restore(); ctx.strokeStyle='rgba(255,245,220,.55)'; ctx.lineWidth=1*S; rr(ctx,x,y,w,h,4*S); ctx.stroke(); } else {ctx.fillStyle=THEME_PRESETS[theme].platform; ctx.fill();} ctx.globalAlpha=1; ctx.shadowBlur=0}
function drawPlayer(){const t=THEME_PRESETS[theme],cw=27*S,ch=27*S,x=player.x-cam.x,y=player.y + Math.sin((1-bounce)*Math.PI)*2.2*S*bounce;ctx.save();ctx.translate(x+cw/2,y+ch);let sx=1,sy=1;if(state==='charging'){sx=1+power*.45;sy=1-power*.4}else if(state==='jumping'||state==='falling'){sx=player.vy<0?.88:1.08;sy=player.vy<0?1.14:.92}ctx.scale(sx,sy);if(theme==='candy'){ctx.beginPath();ctx.arc(-8*S,-13*S,7.3*S,0,Math.PI*2);ctx.arc(0,-17*S,8.8*S,0,Math.PI*2);ctx.arc(8*S,-13*S,7.3*S,0,Math.PI*2);ctx.arc(-3*S,-8*S,8.2*S,0,Math.PI*2);ctx.arc(4*S,-8*S,8.5*S,0,Math.PI*2);ctx.fillStyle=t.char;ctx.fill();ctx.fillStyle='rgba(255,255,255,.62)';ctx.beginPath();ctx.arc(-5*S,-18*S,3.5*S,0,Math.PI*2);ctx.arc(4*S,-19*S,3*S,0,Math.PI*2);ctx.arc(0,-13*S,2.6*S,0,Math.PI*2);ctx.fill();} else {ctx.fillStyle=t.char;rr(ctx,-cw/2,-ch,cw,ch,5.4*S);ctx.fill();}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-cw*.18,-ch*.58,3.8*S,0,Math.PI*2);ctx.arc(cw*.18,-ch*.58,3.8*S,0,Math.PI*2);ctx.fill();ctx.fillStyle=t.pupil;const eyeOffset=(state==='idle')?0:1.2*S;ctx.beginPath();ctx.arc(-cw*.16+eyeOffset,-ch*.56,1.9*S,0,Math.PI*2);ctx.arc(cw*.2+eyeOffset,-ch*.56,1.9*S,0,Math.PI*2);ctx.fill();ctx.strokeStyle=t.pupil;ctx.lineWidth=1.4*S;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-cw*.14,-ch*.25);ctx.quadraticCurveTo(0,-ch*.18+(streak>0?2*S:0),cw*.14,-ch*.25);ctx.stroke();ctx.restore()}
function drawHUD(){const t=THEME_PRESETS[theme];ctx.textAlign='center';ctx.textBaseline='top';ctx.font=`900 ${38*S}px system-ui`;const top=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')||'0')+26*S;const val=mode==='time'?Math.ceil(timeLeft):(mode==='zen'?score.cleared:(mode==='endless'?`∞ · ${score.cleared}`:(modeCfg().target===Infinity?score.cleared:score.remaining)));ctx.fillStyle=t.score;ctx.fillText(val,W/2,top);ctx.font=`700 ${11*S}px system-ui`;ctx.fillStyle=t.dim;ctx.fillText(mode==='time'?'seconds left':(mode==='zen'?'jumps chilled':(mode==='endless'?'jumps survived':'jumps remaining')),W/2,top+41*S);ctx.font=`800 ${14*S}px system-ui`;ctx.fillStyle='#ff5b78';ctx.fillText(lives>0?'\u2665'.repeat(lives):'',W/2,top+56*S);if(streak>0){ctx.fillStyle=t.perfect;ctx.fillText(`Perfect x${streak}`,W/2,top+71*S);}}
function drawParticles(){for(const p of particles){const a=1-p.age/p.life;ctx.globalAlpha=a;if(p.type==='trail'||p.type==='spark'||p.type==='dust'||p.type==='appear'){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.world?(p.x-cam.x):p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size*1.6)}}ctx.globalAlpha=1}

function render(){drawBg();/* Dibujar plataformas: actual, siguiente y anteriores */const curIdx=player.idx;for(let i=0;i<=curIdx+1;i++){if(platforms[i]){if(i===curIdx+1&&platforms[i].appear<1)platforms[i].appear=Math.min(1,platforms[i].appear+0.016*4);drawPlat(platforms[i]);}}drawParticles();drawPlayer();drawFloatTexts();drawHUD();}

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath()}

function loop(ts){if(!lastTs)lastTs=ts;const dt=(ts-lastTs)/1000;lastTs=ts; if(!runEnd) update(dt); render(); requestAnimationFrame(loop)}

['mousedown','touchstart'].forEach(ev=>cv.addEventListener(ev,down,{passive:false}));
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>cv.addEventListener(ev,up,{passive:false}));
window.addEventListener('resize',dprResize);
document.addEventListener('keydown',e=>{if(e.repeat)return; if(e.key==='Escape'){ui.settingsOverlay.classList.remove('show');ui.statsOverlay.classList.remove('show');return;} down(e)});
document.addEventListener('keyup',up);

function sh(el,fn){el.addEventListener('click',e=>{e.stopPropagation();fn(e)});el.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();fn(e)},{passive:false})}
function syncUI(){ui.togSound.classList.toggle('on',settings.sound);ui.togVib.classList.toggle('on',settings.vibration);ui.togAmb.classList.toggle('on',settings.ambience);ui.togParticles.classList.toggle('on',settings.particles);ui.vol.value=Math.round(settings.volume*100);ui.volRow.style.display=settings.sound?'flex':'none';ui.themeSel.value=settings.theme;ui.modeSel.value=settings.mode;}
function renderStats(){ui.runJumps.textContent=score.cleared;ui.runTime.textContent=((performance.now()-firstTs)/1000).toFixed(1)+'s';ui.achGrid.innerHTML='';ACH.forEach(a=>{const d=document.createElement('div');d.className='ach'+(stats.ach[a.id]?'':' lock');d.title=a.desc;d.innerHTML=`<i>${a.icon}</i><b>${a.name}</b>`;ui.achGrid.appendChild(d)});const lb=stats.leaderboard[mode]||[];ui.lb.innerHTML=lb.length?lb.map((r,i)=>`<div class="row"><span>#${i+1} ${new Date(r.t).toLocaleDateString()}</span><span>${r.j} jumps - ${r.time.toFixed(1)}s</span></div>`).join(''):'<div class="row"><span>No scores yet</span><span>Play now!</span></div>'}

sh(document.getElementById('settings-btn'),()=>{syncUI();ui.settingsOverlay.classList.add('show')});
sh(document.getElementById('settings-float'),()=>{syncUI();ui.settingsOverlay.classList.add('show')});
sh(document.getElementById('settings-done'),()=>{ui.settingsOverlay.classList.remove('show')});
sh(document.getElementById('stats-btn'),()=>{renderStats();ui.statsOverlay.classList.add('show')});
sh(document.getElementById('stats-float'),()=>{renderStats();ui.statsOverlay.classList.add('show')});
sh(document.getElementById('stats-done'),()=>ui.statsOverlay.classList.remove('show'));
sh(ui.togSound,()=>{settings.sound=!settings.sound;syncUI();updateAmbience();save()});
sh(ui.togVib,()=>{settings.vibration=!settings.vibration;syncUI();save()});
sh(ui.togAmb,()=>{settings.ambience=!settings.ambience;syncUI();initAudio();save()});
sh(ui.togParticles,()=>{settings.particles=!settings.particles;if(!settings.particles)particles=[];syncUI();save()});
ui.vol.addEventListener('input',()=>{settings.volume=parseInt(ui.vol.value,10)/100;save();updateAmbience();initAudio();tone(520,null,.08,.2)});
ui.themeSel.addEventListener('change',()=>{applyTheme(ui.themeSel.value);save()});
ui.modeSel.addEventListener('change',()=>{mode=ui.modeSel.value;settings.mode=mode;save();reset()});
sh(document.getElementById('share-copy'),copyLeaderboard);
sh(document.getElementById('share-x'),twitterShare);

/* Boton de tema Light/Dark */
const themeBtn=document.getElementById('theme-btn');
const iconSun=document.getElementById('icon-sun');
const iconMoon=document.getElementById('icon-moon');
let isDarkTheme=false;
try{isDarkTheme=localStorage.getItem('100j2_darktheme')==='true';}catch(_){}
function updateThemeIcon(){
  if(isDarkTheme){iconSun.style.display='none';iconMoon.style.display='block';}
  else{iconSun.style.display='block';iconMoon.style.display='none';}
  document.body.classList.toggle('theme-dark',isDarkTheme);
}
function toggleTheme(){isDarkTheme=!isDarkTheme;try{localStorage.setItem('100j2_darktheme',isDarkTheme);}catch(_){}updateThemeIcon();}
sh(themeBtn,toggleTheme);
updateThemeIcon();

applyTheme(settings.theme||'light'); mode=settings.mode||'classic'; syncUI();
/* Mostrar version (commit hash) */
document.getElementById('version-hash').textContent='2026.03.22-8';
// Delay reset to ensure canvas is ready
setTimeout(()=>{reset(); requestAnimationFrame(loop);},50);
