<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano Pulse Switch</title>
<style>
:root{--bg:#09090f;--panel:#161326;--line:#3e3466;--ink:#f3efff;--good:#7af0c5;--bad:#ff8fa3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:linear-gradient(#0b0b14,#09090f);color:var(--ink)}.wrap{max-width:920px;margin:0 auto;padding:18px}.panel{background:#161326;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hud{display:grid;grid-template-columns:repeat(6,minmax(70px,1fr));gap:8px}.kpi{background:#1f1a36;border:1px solid #4c3f77;border-radius:10px;padding:8px;text-align:center}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.lane{height:300px;border-radius:12px;border:1px solid #4f4379;background:linear-gradient(180deg,#1c1732,#131024);position:relative;overflow:hidden}
.note{position:absolute;left:14px;right:14px;height:28px;border-radius:8px;background:linear-gradient(140deg,#b58dff,#8a65ff)}.hit{position:absolute;left:10px;right:10px;bottom:18px;height:34px;border:2px dashed #6f60a8;border-radius:10px}
.player{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:60px;height:24px;border-radius:8px;background:#7af0c5;color:#06261b;font-weight:900;display:flex;align-items:center;justify-content:center}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(145deg,#c7a8ff,#9f77ff)}.ghost{background:#211b39;color:#ddd0ff;border:1px solid #574a83}
#feedback{min-height:22px;font-weight:700}
</style></head><body><div class="wrap"><div class="panel"><h1>🎹 Piano Pulse Switch</h1>
<p><b>Cómo jugar:</b> A/S/D para moverte de carril. Atrapa notas en la hit-zone. <b>Perfect</b> (centro) da más puntos/combo, <b>Good</b> da menos. Misses 9 = game over. Win al llegar a 420 puntos.</p>
<div class="hud"><div class="kpi">Score<br><b id="score">0</b></div><div class="kpi">Combo<br><b id="combo">0</b></div><div class="kpi">Misses<br><b id="miss">0/9</b></div><div class="kpi">Time<br><b id="time">75</b>s</div><div class="kpi">BPM<br><b id="bpm">104</b></div><div class="kpi">Lane<br><b id="lane">2</b></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="primary" id="start">Start Jam</button><button class="ghost" onclick="switchLane(0)">A</button><button class="ghost" onclick="switchLane(1)">S</button><button class="ghost" onclick="switchLane(2)">D</button><button class="ghost" id="reset">Reset</button><a class="ghost" style="text-decoration:none" href="./report.html">Open report</a></div><p id="feedback">Start a jam.</p></div>
<div class="panel"><div class="lanes" id="lanes"></div></div><div class="panel"><p id="result">Sin run.</p></div></div>
<script>
const lanesEl=document.getElementById('lanes');
let S={live:false,score:0,combo:0,miss:0,time:75,bpm:104,lane:1,notes:[],t:null,spawn:null,sec:null,target:420};
const HIT=238;
function msg(t,ok){const f=document.getElementById('feedback');f.textContent=t;f.style.color=ok?'#7af0c5':'#ff9aa8'}
function render(){lanesEl.innerHTML='';for(let i=0;i<3;i++){const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="hit"></div>'+(S.lane===i?'<div class="player">YOU</div>':'');S.notes.filter(n=>n.l===i).forEach(n=>{const d=document.createElement('div');d.className='note';d.style.top=n.y+'px';lane.appendChild(d)});lanesEl.appendChild(lane)}
document.getElementById('score').textContent=S.score;document.getElementById('combo').textContent=S.combo;document.getElementById('miss').textContent=S.miss+'/9';document.getElementById('time').textContent=S.time;document.getElementById('bpm').textContent=S.bpm;document.getElementById('lane').textContent=S.lane+1}
function switchLane(i){if(!S.live)return;S.lane=i;render()}
function spawn(){if(!S.live)return;S.notes.push({l:Math.floor(Math.random()*3),y:-20,hit:false})}
function end(win,why){S.live=false;clearInterval(S.t);clearInterval(S.spawn);clearInterval(S.sec);document.getElementById('result').textContent=`${win?'🏆 WIN':'💥 GAME OVER'} — ${why}. Score ${S.score}`;msg(win?'Sesión completada':'Try again',win)}
function loop(){if(!S.live)return;const spd=3+S.bpm/125;S.notes.forEach(n=>n.y+=spd);
for(const n of S.notes){if(n.hit)continue;const dy=Math.abs(n.y-HIT);if(n.l===S.lane && dy<=7){n.hit=true;S.score+=16+Math.min(30,S.combo*2);S.combo++;msg('Perfect!',true)}else if(n.l===S.lane && dy<=16){n.hit=true;S.score+=9+Math.min(20,S.combo);S.combo++;msg('Good!',true)}else if(n.y>255){n.hit=true;S.miss++;S.combo=0;msg('Miss',false)}}
S.notes=S.notes.filter(n=>n.y<300&&!n.hit);
if(S.miss>=9)return end(false,'Demasiados misses');if(S.score>=S.target)return end(true,'Objetivo alcanzado');render()}
function tick(){if(!S.live)return;S.time--;if(S.time%12===0)S.bpm+=6;if(S.time<=0){if(S.score>=S.target)return end(true,'Tiempo límite con objetivo');return end(false,'Tiempo agotado')}}
function start(){S={live:true,score:0,combo:0,miss:0,time:75,bpm:104,lane:1,notes:[],t:null,spawn:null,sec:null,target:420};render();document.getElementById('result').textContent='Run activo';msg('Catch notes on beat',true);S.t=setInterval(loop,50);S.spawn=setInterval(spawn,520);S.sec=setInterval(tick,1000)}
document.getElementById('start').onclick=start;document.getElementById('reset').onclick=()=>{clearInterval(S.t);clearInterval(S.spawn);clearInterval(S.sec);S.live=false;S.notes=[];render();document.getElementById('result').textContent='Reset';msg('Ready',true)}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a')switchLane(0);if(k==='s')switchLane(1);if(k==='d')switchLane(2)});render();
</script></body></html>
