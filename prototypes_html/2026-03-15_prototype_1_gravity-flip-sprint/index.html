<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gravity Flip Sprint</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #0d0d15 0%, #1a0a2e 50%, #0d0d15 100%);
            overflow: hidden;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .score-box {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 4px;
        }
        .score-value {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00f5d4, #00bbf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .streak-box {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,200,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .streak-icon { font-size: 18px; }
        .streak-value { font-weight: 700; color: #ffd700; }
        #gravityIndicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 100px;
            background: rgba(0,0,0,0.5);
            border-radius: 25px;
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        #gravityArrow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            transition: top 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .screen {
            position: absolute;
            inset: 0;
            background: rgba(10,10,15,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
            padding: 30px;
            text-align: center;
        }
        .screen.hidden { display: none; }
        .logo {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #00f5d4, #9b5de5, #f15bb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .tagline {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
        }
        .instruction-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 320px;
        }
        .instruction-visual {
            font-size: 50px;
            margin-bottom: 15px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .instruction-text {
            font-size: 15px;
            line-height: 1.6;
            color: #ccc;
        }
        .btn {
            background: linear-gradient(135deg, #00f5d4, #00bbf9);
            border: none;
            padding: 18px 50px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(0,245,212,0.3); }
        .btn:active { transform: scale(0.98); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
            width: 100%;
            max-width: 320px;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .badge {
            background: linear-gradient(135deg, #ffd700, #ff9f1c);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 20px;
            animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes badgePop {
            0% { transform: scale(0) rotate(-10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .tap-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            animation: fadePulse 1.5s ease-in-out infinite;
        }
        @keyframes fadePulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        .combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.5);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s;
        }
        .combo-display.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div class="hud" id="hud" style="display: none;">
                <div class="score-box">
                    <div class="score-label">Distance</div>
                    <div class="score-value" id="scoreDisplay">0m</div>
                </div>
                <div class="streak-box">
                    <span class="streak-icon">🔥</span>
                    <span class="streak-value" id="streakDisplay">0</span>
                </div>
            </div>
            <div id="gravityIndicator" style="display: none;">
                <div id="gravityArrow">⬆️</div>
            </div>
            <div class="combo-display" id="comboDisplay">PERFECT!</div>
            <div class="tap-hint" id="tapHint" style="display: none;">TAP TO FLIP GRAVITY</div>
        </div>
        
        <div id="startScreen" class="screen">
            <div class="logo">GRAVITY FLIP</div>
            <div class="tagline">Defy physics. Master the flip.</div>
            <div class="instruction-card">
                <div class="instruction-visual">🔄</div>
                <div class="instruction-text">
                    <strong>Tap anywhere</strong> to flip gravity.<br>
                    Avoid <span style="color:#ff4757">red barriers</span>.<br>
                    Collect <span style="color:#00f5d4">cyan orbs</span> for bonus.<br>
                    Survive as long as you can!
                </div>
            </div>
            <button class="btn" onclick="game.start()">Start Sprint</button>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <div class="logo" style="font-size: 36px; background: linear-gradient(135deg, #ff4757, #ff6b7a);">GAME OVER</div>
            <div id="finalBadge" class="badge" style="display: none;"></div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="finalDistance">0</div>
                    <div class="stat-label">Meters</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="finalOrbs">0</div>
                    <div class="stat-label">Orbs</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="finalBest">0</div>
                    <div class="stat-label">Best</div>
                </div>
            </div>
            <button class="btn" onclick="game.restart()">Try Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        const game = {
            state: 'start', // start, playing, gameover
            score: 0,
            bestScore: parseInt(localStorage.getItem('gravityFlipBest') || '0'),
            streak: 0,
            orbs: 0,
            gravity: 1, // 1 = down, -1 = up
            speed: 5,
            distance: 0,
            combo: 0,
            
            // Player
            player: {
                x: 80,
                y: 0,
                radius: 12,
                vy: 0,
                flipCooldown: 0
            },
            
            // Entities
            barriers: [],
            collectibles: [],
            particles: [],
            
            // Config
            gravityForce: 0.6,
            flipImpulse: 8,
            barrierWidth: 60,
            gapSize: 110,
            
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // Input handlers
                const handleInput = (e) => {
                    e.preventDefault();
                    if (this.state === 'playing') this.flipGravity();
                };
                
                canvas.addEventListener('pointerdown', handleInput);
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp') {
                        e.preventDefault();
                        if (this.state === 'playing') this.flipGravity();
                    }
                });
                
                this.loop();
            },
            
            resize() {
                const container = document.getElementById('gameContainer');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                this.player.y = canvas.height / 2;
            },
            
            start() {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('gravityIndicator').style.display = 'block';
                document.getElementById('tapHint').style.display = 'block';
                
                this.reset();
                this.state = 'playing';
                setTimeout(() => {
                    document.getElementById('tapHint').style.display = 'none';
                }, 3000);
            },
            
            reset() {
                this.score = 0;
                this.distance = 0;
                this.orbs = 0;
                this.combo = 0;
                this.speed = 5;
                this.gravity = 1;
                this.player.y = canvas.height / 2;
                this.player.vy = 0;
                this.player.flipCooldown = 0;
                this.barriers = [];
                this.collectibles = [];
                this.particles = [];
                
                // Initial barriers
                this.spawnBarrier(canvas.width + 200);
                this.spawnBarrier(canvas.width + 500);
                this.spawnBarrier(canvas.width + 800);
                
                this.updateUI();
            },
            
            flipGravity() {
                if (this.player.flipCooldown > 0) return;
                
                this.gravity *= -1;
                this.player.vy = this.gravity * this.flipImpulse;
                this.player.flipCooldown = 8;
                
                // Visual feedback
                this.createExplosion(this.player.x, this.player.y, this.gravity === 1 ? '#00f5d4' : '#9b5de5', 15);
                
                // Update gravity indicator
                const arrow = document.getElementById('gravityArrow');
                arrow.textContent = this.gravity === 1 ? '⬇️' : '⬆️';
                arrow.style.top = this.gravity === 1 ? '60px' : '20px';
            },
            
            spawnBarrier(x) {
                const minGapY = 80;
                const maxGapY = canvas.height - 80;
                const gapY = minGapY + Math.random() * (maxGapY - minGapY);
                
                this.barriers.push({
                    x: x,
                    gapY: gapY,
                    gapSize: this.gapSize,
                    width: this.barrierWidth,
                    passed: false
                });
            },
            
            spawnCollectible(x, y) {
                this.collectibles.push({
                    x: x,
                    y: y,
                    radius: 8,
                    collected: false,
                    pulse: 0
                });
            },
            
            createExplosion(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * (2 + Math.random() * 3),
                        vy: Math.sin(angle) * (2 + Math.random() * 3),
                        life: 1,
                        color: color,
                        size: 2 + Math.random() * 3
                    });
                }
            },
            
            update() {
                if (this.state !== 'playing') return;
                
                // Update player
                this.player.vy += this.gravity * this.gravityForce;
                this.player.y += this.player.vy;
                this.player.flipCooldown = Math.max(0, this.player.flipCooldown - 1);
                
                // Screen boundaries
                if (this.player.y < this.player.radius || this.player.y > canvas.height - this.player.radius) {
                    this.gameOver();
                    return;
                }
                
                // Update distance and speed
                this.distance += this.speed * 0.1;
                this.speed = Math.min(12, 5 + this.distance * 0.002);
                this.gapSize = Math.max(90, 110 - this.distance * 0.01);
                
                // Spawn barriers
                const lastBarrier = this.barriers[this.barriers.length - 1];
                if (lastBarrier && lastBarrier.x < canvas.width) {
                    this.spawnBarrier(lastBarrier.x + 250 + Math.random() * 100);
                }
                
                // Update barriers
                this.barriers = this.barriers.filter(b => {
                    b.x -= this.speed;
                    
                    // Check collision
                    if (!b.passed && b.x < this.player.x) {
                        b.passed = true;
                        this.score++;
                        this.updateUI();
                        
                        // Chance to spawn collectible in gap
                        if (Math.random() < 0.4) {
                            this.spawnCollectible(b.x + b.width / 2, b.gapY);
                        }
                    }
                    
                    // Collision with barrier
                    if (b.x < this.player.x + this.player.radius && 
                        b.x + b.width > this.player.x - this.player.radius) {
                        if (this.player.y - this.player.radius < b.gapY - b.gapSize / 2 ||
                            this.player.y + this.player.radius > b.gapY + b.gapSize / 2) {
                            this.gameOver();
                            return false;
                        }
                    }
                    
                    return b.x > -b.width;
                });
                
                // Update collectibles
                this.collectibles = this.collectibles.filter(c => {
                    c.x -= this.speed;
                    c.pulse += 0.1;
                    
                    // Check collection
                    const dx = this.player.x - c.x;
                    const dy = this.player.y - c.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (!c.collected && dist < this.player.radius + c.radius + 5) {
                        c.collected = true;
                        this.orbs++;
                        this.streak++;
                        this.createExplosion(c.x, c.y, '#ffd700', 8);
                        this.showCombo('+' + (10 * this.streak));
                        this.updateUI();
                        return false;
                    }
                    
                    return c.x > -20 && !c.collected;
                });
                
                // Reset streak if no orb collected recently
                if (this.distance % 500 < 1) this.streak = Math.max(0, this.streak - 1);
                
                // Update particles
                this.particles = this.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03;
                    p.vx *= 0.98;
                    p.vy *= 0.98;
                    return p.life > 0;
                });
                
                this.updateUI();
            },
            
            showCombo(text) {
                const combo = document.getElementById('comboDisplay');
                combo.textContent = text;
                combo.classList.add('show');
                setTimeout(() => combo.classList.remove('show'), 800);
            },
            
            draw() {
                // Clear with trail effect
                ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw grid background
                ctx.strokeStyle = 'rgba(0, 245, 212, 0.05)';
                ctx.lineWidth = 1;
                const gridOffset = (this.distance * 2) % 40;
                for (let x = -gridOffset; x < canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // Draw barriers
                this.barriers.forEach(b => {
                    const gradient = ctx.createLinearGradient(b.x, 0, b.x + b.width, 0);
                    gradient.addColorStop(0, 'rgba(255, 71, 87, 0.8)');
                    gradient.addColorStop(0.5, 'rgba(255, 107, 122, 1)');
                    gradient.addColorStop(1, 'rgba(255, 71, 87, 0.8)');
                    
                    // Top barrier
                    ctx.fillStyle = gradient;
                    ctx.fillRect(b.x, 0, b.width, b.gapY - b.gapSize / 2);
                    
                    // Bottom barrier
                    ctx.fillRect(b.x, b.gapY + b.gapSize / 2, b.width, canvas.height - b.gapY - b.gapSize / 2);
                    
                    // Glow effect
                    ctx.shadowColor = '#ff4757';
                    ctx.shadowBlur = 20;
                    ctx.fillRect(b.x, b.gapY - b.gapSize / 2 - 2, b.width, 4);
                    ctx.fillRect(b.x, b.gapY + b.gapSize / 2 - 2, b.width, 4);
                    ctx.shadowBlur = 0;
                });
                
                // Draw collectibles
                this.collectibles.forEach(c => {
                    const pulse = Math.sin(c.pulse) * 2;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius + pulse, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // Inner glow
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                });
                
                // Draw player trail
                this.particles.slice(-20).forEach((p, i) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 245, 212, ${p.life * 0.3})`;
                    ctx.fill();
                });
                
                // Draw player
                ctx.beginPath();
                ctx.arc(this.player.x, this.player.y, this.player.radius, 0, Math.PI * 2);
                const playerGradient = ctx.createRadialGradient(
                    this.player.x - 3, this.player.y - 3, 0,
                    this.player.x, this.player.y, this.player.radius
                );
                playerGradient.addColorStop(0, this.gravity === 1 ? '#00f5d4' : '#9b5de5');
                playerGradient.addColorStop(1, this.gravity === 1 ? '#00bbf9' : '#f15bb5');
                ctx.fillStyle = playerGradient;
                ctx.fill();
                
                // Player glow
                ctx.shadowColor = this.gravity === 1 ? '#00f5d4' : '#9b5de5';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Player inner detail
                ctx.beginPath();
                ctx.arc(this.player.x, this.player.y, this.player.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
                
                // Draw particles
                this.particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('rgb', 'rgba').replace('#', '');
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            },
            
            updateUI() {
                document.getElementById('scoreDisplay').textContent = Math.floor(this.distance) + 'm';
                document.getElementById('streakDisplay').textContent = this.streak;
            },
            
            gameOver() {
                this.state = 'gameover';
                
                // Create explosion effect
                this.createExplosion(this.player.x, this.player.y, '#ff4757', 30);
                
                // Update best score
                if (Math.floor(this.distance) > this.bestScore) {
                    this.bestScore = Math.floor(this.distance);
                    localStorage.setItem('gravityFlipBest', this.bestScore.toString());
                }
                
                // Show badge if applicable
                const badge = document.getElementById('finalBadge');
                if (this.distance > 500) {
                    badge.textContent = '🏆 Gravity Master!';
                    badge.style.display = 'block';
                } else if (this.distance > 200) {
                    badge.textContent = '⭐ Flip Expert';
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
                
                document.getElementById('finalDistance').textContent = Math.floor(this.distance);
                document.getElementById('finalOrbs').textContent = this.orbs;
                document.getElementById('finalBest').textContent = this.bestScore;
                
                setTimeout(() => {
                    document.getElementById('gameOverScreen').classList.remove('hidden');
                }, 500);
            },
            
            restart() {
                this.start();
            },
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };
        
        // Start
        game.init();
    </script>
</body>
</html>
