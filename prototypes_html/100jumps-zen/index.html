<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100 Jumps - Zen Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            background: #0a0a12;
            overflow: hidden;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ui-overlay.interactive {
            pointer-events: auto;
        }
        .zen-title {
            position: absolute;
            top: 15%;
            text-align: center;
            color: white;
            opacity: 0;
            animation: zenFadeIn 2s ease-out forwards;
        }
        .zen-title h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            margin-bottom: 15px;
            text-shadow: 0 0 40px rgba(255,255,255,0.3);
        }
        .zen-title p {
            font-size: clamp(1rem, 3vw, 1.3rem);
            opacity: 0.6;
            letter-spacing: 0.1em;
        }
        @keyframes zenFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .breathing-guide {
            position: absolute;
            bottom: 25%;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            opacity: 0;
            animation: breathePulse 4s ease-in-out infinite, fadeInGuide 2s 1s forwards;
        }
        .breathing-guide.charging {
            animation: none;
            border-color: rgba(100, 200, 255, 0.6);
            transform: scale(1);
            transition: transform 0.1s linear;
        }
        @keyframes breathePulse {
            0%, 100% { transform: scale(1); opacity: 0.3; border-color: rgba(100, 200, 255, 0.3); }
            50% { transform: scale(1.3); opacity: 0.6; border-color: rgba(100, 200, 255, 0.6); }
        }
        @keyframes fadeInGuide {
            to { opacity: 1; }
        }
        .score-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            pointer-events: none;
        }
        .score-display .number {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 200;
            letter-spacing: 0.1em;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .score-display .label {
            font-size: 0.9rem;
            opacity: 0.5;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .zen-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.9);
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .zen-message.show {
            opacity: 1;
        }
        .controls-hint {
            position: absolute;
            bottom: 15%;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-align: center;
            animation: fadeOut 4s forwards;
            animation-delay: 5s;
        }
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        .ambient-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .control-btn.active {
            background: rgba(100, 200, 255, 0.2);
            border-color: rgba(100, 200, 255, 0.4);
            color: rgba(100, 200, 255, 0.9);
        }
        .hidden {
            display: none !important;
        }
        .zen-notification {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .zen-notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="zen-title" id="zenTitle">
        <h1>ZEN JUMPS</h1>
        <p>Find your flow</p>
    </div>
    
    <div class="score-display">
        <div class="number" id="scoreNumber">0</div>
        <div class="label">Peaceful Jumps</div>
    </div>
    
    <div class="breathing-guide" id="breathingGuide"></div>
    
    <div class="zen-message" id="zenMessage"></div>
    
    <div class="zen-notification" id="zenNotification">Breathe... Release... Flow...</div>
    
    <div class="controls-hint">Hold to breathe • Release to flow</div>
    
    <div class="ambient-controls">
        <button class="control-btn active" id="musicBtn" onclick="game.toggleMusic()">🎵</button>
        <button class="control-btn active" id="soundBtn" onclick="game.toggleSound()">🎧</button>
    </div>

    <script>
        // Ambient Audio Generator
        class AmbientAudio {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.musicEnabled = true;
                this.soundEnabled = true;
                this.oscillators = [];
                this.gainNodes = [];
                this.droneInterval = null;
                this.setupDrone();
            }
            
            setupDrone() {
                const frequencies = [110, 164.81, 196, 246.94];
                frequencies.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.value = 0;
                    osc.start();
                    this.oscillators.push(osc);
                    this.gainNodes.push(gain);
                });
            }
            
            startDrone() {
                if (!this.musicEnabled) return;
                this.gainNodes.forEach((gain, i) => {
                    gain.gain.setTargetAtTime(0.03 + i * 0.01, this.ctx.currentTime, 2);
                });
                this.droneInterval = setInterval(() => {
                    if (!this.musicEnabled) return;
                    this.oscillators.forEach(osc => {
                        const drift = (Math.random() - 0.5) * 2;
                        osc.frequency.setTargetAtTime(osc.frequency.value + drift, this.ctx.currentTime, 3);
                    });
                }, 5000);
            }
            
            stopDrone() {
                this.gainNodes.forEach(gain => {
                    gain.gain.setTargetAtTime(0, this.ctx.currentTime, 1);
                });
                if (this.droneInterval) {
                    clearInterval(this.droneInterval);
                    this.droneInterval = null;
                }
            }
            
            playSoftJump() {
                if (!this.soundEnabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                filter.type = 'lowpass';
                filter.frequency.value = 800;
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.8);
            }
            
            playSoftLand() {
                if (!this.soundEnabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.1, this.ctx.currentTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
            
            playChime() {
                if (!this.soundEnabled) return;
                [523.25, 659.25].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + i * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 2);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + i * 0.1 + 2);
                });
            }
        }

        // Soft Particles for Zen mode
        class ZenParticle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1 - 0.5;
                this.life = 1;
                this.decay = 0.005 + Math.random() * 0.01;
                this.hue = hue || 200 + Math.random() * 60;
                this.size = 2 + Math.random() * 3;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.02;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life * 0.6;
                ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, 1)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Floating Orbs for ambiance
        class AmbientOrb {
            constructor(canvasWidth, canvasHeight) {
                this.x = Math.random() * canvasWidth;
                this.y = Math.random() * canvasHeight;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = 50 + Math.random() * 100;
                this.hue = 200 + Math.random() * 60;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            update(canvasWidth, canvasHeight) {
                this.x += this.vx;
                this.y += this.vy;
                this.pulsePhase += 0.01;
                if (this.x < -this.radius) this.x = canvasWidth + this.radius;
                if (this.x > canvasWidth + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvasHeight + this.radius;
                if (this.y > canvasHeight + this.radius) this.y = -this.radius;
            }
            draw(ctx) {
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                grad.addColorStop(0, `hsla(${this.hue}, 60%, 60%, ${0.1 * pulse})`);
                grad.addColorStop(1, `hsla(${this.hue}, 60%, 60%, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const STATE = {
            IDLE: 'idle',
            CHARGING: 'charging',
            JUMPING: 'jumping'
        };

        const ZEN_MESSAGES = [
            "Breathe in peace",
            "Flow like water",
            "Find your center",
            "Harmony achieved",
            "Serenity grows",
            "Tranquil steps",
            "Mindful moment",
            "Peace within",
            "Gentle journey",
            "Stillness moves"
        ];

        // Physics constants (same as clone for consistent feel)
        const CONSTANTS = {
            GRAVITY: 0.35, // Slightly lower for more zen feel
            MIN_JUMP_POWER: 6.5,
            MAX_JUMP_POWER: 14,
            MAX_CHARGE_TIME: 900, // Slightly slower charge for zen
            ANGLE: -Math.PI / 4,
            PLATFORM_HEIGHT: 12,
            PLAYER_SIZE: 28,
            PERFECT_ZONE_RATIO: 0.25, // 25% for zen (more forgiving)
            VIEW_AHEAD: 3
        };

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = new AmbientAudio();
                this.resize();
                
                this.state = STATE.IDLE;
                this.score = 0;
                this.combo = 0;
                this.camera = { x: 0, y: 0 };
                this.platforms = [];
                this.particles = [];
                this.orbs = [];
                this.ambientHue = 220;
                
                this.player = {
                    x: 0, y: 0,
                    vx: 0, vy: 0,
                    width: CONSTANTS.PLAYER_SIZE,
                    height: CONSTANTS.PLAYER_SIZE,
                    onGround: false,
                    scaleX: 1, scaleY: 1,
                    breathPhase: 0
                };
                
                this.charging = false;
                this.chargeStartTime = 0;
                this.chargeRatio = 0;
                this.currentPlatformIndex = 0;
                this.highestGeneratedIndex = 0;
                
                // Create ambient orbs
                for (let i = 0; i < 5; i++) {
                    this.orbs.push(new AmbientOrb(this.canvas.width, this.canvas.height));
                }
                
                this.setupInputs();
                this.initGame();
                this.audio.startDrone();
                this.loop();
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.dpr = Math.min(window.devicePixelRatio || 1, 2);
                this.canvas.style.width = window.innerWidth + 'px';
                this.canvas.style.height = window.innerHeight + 'px';
                this.ctx.scale(this.dpr, this.dpr);
            }
            
            initGame() {
                this.platforms = [];
                this.currentPlatformIndex = 0;
                this.highestGeneratedIndex = 0;
                this.score = 0;
                this.combo = 0;
                
                // Starting platform
                const startY = this.canvas.height / this.dpr - 200;
                this.platforms.push({
                    x: 50,
                    y: startY,
                    width: 130,
                    height: CONSTANTS.PLATFORM_HEIGHT
                });
                
                // Generate initial platforms (gentler for zen)
                this.generatePlatformsAhead(5);
                this.resetPlayer();
            }
            
            generatePlatformsAhead(count) {
                let lastPlat = this.platforms[this.platforms.length - 1];
                
                for (let i = 0; i < count; i++) {
                    const jumpNum = this.platforms.length;
                    
                    // Zen mode: gentler, more consistent spacing
                    const gap = 90 + Math.random() * 70;
                    const width = Math.max(60, 90 - jumpNum * 0.03);
                    const yOffset = (Math.random() - 0.5) * 60; // Less vertical variation
                    
                    let newY = lastPlat.y + yOffset;
                    newY = Math.max(150, Math.min(this.canvas.height / this.dpr - 150, newY));
                    
                    const newPlat = {
                        x: lastPlat.x + lastPlat.width + gap,
                        y: newY,
                        width: width,
                        height: CONSTANTS.PLATFORM_HEIGHT
                    };
                    
                    this.platforms.push(newPlat);
                    lastPlat = newPlat;
                }
                
                this.highestGeneratedIndex = this.platforms.length - 1;
            }
            
            resetPlayer() {
                const start = this.platforms[0];
                this.player.x = start.x + start.width / 2 - this.player.width / 2;
                this.player.y = start.y - this.player.height;
                this.player.vx = 0;
                this.player.vy = 0;
                this.player.onGround = true;
                this.player.scaleX = 1;
                this.player.scaleY = 1;
                this.currentPlatformIndex = 0;
            }
            
            setupInputs() {
                const startCharge = (e) => {
                    if (this.state !== STATE.IDLE || !this.player.onGround) return;
                    e.preventDefault();
                    this.charging = true;
                    this.chargeStartTime = Date.now();
                    this.chargeRatio = 0;
                    this.state = STATE.CHARGING;
                    
                    document.getElementById('breathingGuide').classList.add('charging');
                    
                    if (this.audio.ctx.state === 'suspended') {
                        this.audio.ctx.resume();
                    }
                };
                
                const endCharge = (e) => {
                    if (!this.charging || this.state !== STATE.CHARGING) return;
                    e.preventDefault();
                    this.charging = false;
                    document.getElementById('breathingGuide').classList.remove('charging');
                    document.getElementById('breathingGuide').style.transform = '';
                    this.jump();
                };
                
                this.canvas.addEventListener('mousedown', startCharge);
                this.canvas.addEventListener('mouseup', endCharge);
                this.canvas.addEventListener('touchstart', startCharge, { passive: false });
                this.canvas.addEventListener('touchend', endCharge, { passive: false });
                
                window.addEventListener('keydown', (e) => {
                    if (e.repeat) return;
                    if (e.code === 'Space') startCharge(e);
                });
                
                window.addEventListener('keyup', (e) => {
                    if (e.code === 'Space') endCharge(e);
                });
                
                window.addEventListener('resize', () => {
                    this.resize();
                    if (this.player.y > this.canvas.height / this.dpr - 100) {
                        const plat = this.platforms[this.currentPlatformIndex];
                        this.player.y = plat.y - this.player.height;
                    }
                });
            }
            
            jump() {
                const chargeTime = Date.now() - this.chargeStartTime;
                const rawRatio = Math.min(chargeTime / CONSTANTS.MAX_CHARGE_TIME, 1);
                
                // Minimum jump for zen mode (very gentle)
                this.chargeRatio = Math.max(0.12, rawRatio);
                
                this.audio.playSoftJump();
                
                const jumpPower = CONSTANTS.MIN_JUMP_POWER + 
                    this.chargeRatio * (CONSTANTS.MAX_JUMP_POWER - CONSTANTS.MIN_JUMP_POWER);
                
                this.player.vx = Math.cos(CONSTANTS.ANGLE) * jumpPower;
                this.player.vy = Math.sin(CONSTANTS.ANGLE) * jumpPower;
                this.player.onGround = false;
                this.state = STATE.JUMPING;
                
                this.player.scaleX = 0.75;
                this.player.scaleY = 1.25;
            }
            
            update() {
                // Update orbs
                this.orbs.forEach(orb => orb.update(this.canvas.width, this.canvas.height));
                
                // Update particles
                this.particles = this.particles.filter(p => {
                    p.update();
                    return p.life > 0;
                });
                
                // Slowly shift ambient hue
                this.ambientHue += 0.08;
                
                // Update charge visualization
                if (this.state === STATE.CHARGING) {
                    const chargeTime = Date.now() - this.chargeStartTime;
                    const ratio = Math.min(chargeTime / CONSTANTS.MAX_CHARGE_TIME, 1);
                    
                    // Scale breathing guide with charge
                    const scale = 1 + ratio * 0.5;
                    document.getElementById('breathingGuide').style.transform = `scale(${scale})`;
                    
                    // Breathing animation
                    this.player.breathPhase += 0.05;
                    const breath = Math.sin(this.player.breathPhase) * 0.08 + 1;
                    this.player.scaleX = breath + ratio * 0.25;
                    this.player.scaleY = breath - ratio * 0.2;
                }
                
                // Player physics
                if (this.state === STATE.JUMPING) {
                    this.player.vy += CONSTANTS.GRAVITY;
                    this.player.x += this.player.vx;
                    this.player.y += this.player.vy;
                    
                    const stretch = Math.min(Math.abs(this.player.vy) * 0.025, 0.25);
                    this.player.scaleX = 0.9 - stretch;
                    this.player.scaleY = 1.1 + stretch;
                    
                    this.checkLanding();
                    
                    // In Zen mode, soft reset if fell
                    if (this.player.y > this.canvas.height / this.dpr + 50) {
                        this.softReset();
                    }
                }
                
                // Smooth return to normal
                if (this.state === STATE.IDLE) {
                    this.player.scaleX += (1 - this.player.scaleX) * 0.1;
                    this.player.scaleY += (1 - this.player.scaleY) * 0.1;
                }
                
                // Smooth camera
                const targetCamX = this.player.x - this.canvas.width / this.dpr / 3;
                this.camera.x += (targetCamX - this.camera.x) * 0.08;
                this.camera.x = Math.max(0, this.camera.x);
                
                // Generate more platforms if needed
                this.managePlatformGeneration();
                
                // Update score
                document.getElementById('scoreNumber').textContent = this.score;
            }
            
            managePlatformGeneration() {
                const visibleAhead = this.currentPlatformIndex + CONSTANTS.VIEW_AHEAD * 2;
                if (visibleAhead >= this.highestGeneratedIndex) {
                    this.generatePlatformsAhead(3);
                }
            }
            
            checkLanding() {
                if (this.player.vy < 0) return;
                
                const playerCenterX = this.player.x + this.player.width / 2;
                const playerBottomY = this.player.y + this.player.height;
                
                for (let i = this.currentPlatformIndex; i < Math.min(this.platforms.length, this.currentPlatformIndex + 3); i++) {
                    const plat = this.platforms[i];
                    
                    if (playerCenterX >= plat.x && playerCenterX <= plat.x + plat.width) {
                        if (playerBottomY >= plat.y && 
                            playerBottomY <= plat.y + plat.height + 10 &&
                            this.player.vy > 0) {
                            
                            this.land(plat, i);
                            return;
                        }
                    }
                }
            }
            
            land(platform, platformIndex) {
                this.player.y = platform.y - this.player.height;
                this.player.vx = 0;
                this.player.vy = 0;
                this.player.onGround = true;
                
                if (platformIndex > this.currentPlatformIndex) {
                    this.currentPlatformIndex = platformIndex;
                    this.score++;
                    this.combo++;
                    
                    // Check landing quality (25% zone for zen)
                    const playerCenterX = this.player.x + this.player.width / 2;
                    const platformCenterX = platform.x + platform.width / 2;
                    const perfectZoneHalfWidth = (platform.width * CONSTANTS.PERFECT_ZONE_RATIO) / 2;
                    
                    const isPerfect = Math.abs(playerCenterX - platformCenterX) <= perfectZoneHalfWidth;
                    
                    if (isPerfect) {
                        this.audio.playChime();
                        this.spawnZenParticles(playerCenterX, this.player.y + this.player.height, this.ambientHue);
                        
                        if (this.combo % 10 === 0) {
                            this.showZenMessage();
                        }
                    } else {
                        this.audio.playSoftLand();
                        this.combo = 0;
                    }
                }
                
                // Gentle bounce
                this.player.scaleX = 1.1;
                this.player.scaleY = 0.9;
                
                this.state = STATE.IDLE;
            }
            
            softReset() {
                // Zen reset - no penalty, just return to last platform
                const plat = this.platforms[this.currentPlatformIndex];
                this.player.x = plat.x + plat.width / 2 - this.player.width / 2;
                this.player.y = plat.y - this.player.height;
                this.player.vx = 0;
                this.player.vy = 0;
                this.state = STATE.IDLE;
                this.combo = 0;
                
                // Gentle notification
                const notif = document.getElementById('zenNotification');
                notif.textContent = "Breathe... Try again...";
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 2000);
                
                this.spawnZenParticles(this.player.x + this.player.width / 2, 
                    this.player.y + this.player.height + 50, 0);
            }
            
            spawnZenParticles(x, y, hue) {
                for (let i = 0; i < 10; i++) {
                    this.particles.push(new ZenParticle(x, y, hue));
                }
            }
            
            showZenMessage() {
                const msg = ZEN_MESSAGES[Math.floor(Math.random() * ZEN_MESSAGES.length)];
                const el = document.getElementById('zenMessage');
                el.textContent = msg;
                el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 3000);
            }
            
            toggleMusic() {
                this.audio.musicEnabled = !this.audio.musicEnabled;
                document.getElementById('musicBtn').classList.toggle('active');
                if (this.audio.musicEnabled) {
                    this.audio.startDrone();
                } else {
                    this.audio.stopDrone();
                }
            }
            
            toggleSound() {
                this.audio.soundEnabled = !this.audio.soundEnabled;
                document.getElementById('soundBtn').classList.toggle('active');
            }
            
            draw() {
                // Dynamic gradient background
                const hue = (this.ambientHue % 60) + 200;
                const grad = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                grad.addColorStop(0, `hsl(${hue}, 40%, 8%)`);
                grad.addColorStop(1, `hsl(${hue + 20}, 30%, 5%)`);
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw ambient orbs
                this.orbs.forEach(orb => orb.draw(this.ctx));
                
                this.ctx.save();
                this.ctx.translate(-this.camera.x, 0);
                
                // Draw only visible platforms
                const visibleStart = Math.max(0, this.currentPlatformIndex - 1);
                const visibleEnd = Math.min(this.platforms.length, this.currentPlatformIndex + CONSTANTS.VIEW_AHEAD + 2);
                
                for (let i = visibleStart; i < visibleEnd; i++) {
                    const plat = this.platforms[i];
                    
                    if (plat.x - this.camera.x > this.canvas.width / this.dpr) continue;
                    if (plat.x + plat.width - this.camera.x < 0) continue;
                    
                    // Soft glow
                    const glowGrad = this.ctx.createRadialGradient(
                        plat.x + plat.width / 2, plat.y + plat.height / 2, 0,
                        plat.x + plat.width / 2, plat.y + plat.height / 2, plat.width
                    );
                    glowGrad.addColorStop(0, `hsla(${this.ambientHue}, 50%, 50%, 0.08)`);
                    glowGrad.addColorStop(1, 'transparent');
                    this.ctx.fillStyle = glowGrad;
                    this.ctx.fillRect(plat.x - 20, plat.y - 20, plat.width + 40, plat.height + 40);
                    
                    // Platform
                    this.ctx.fillStyle = `hsla(${this.ambientHue}, 30%, 40%, 0.5)`;
                    this.ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    
                    // Center highlight (perfect zone indicator)
                    const centerW = plat.width * CONSTANTS.PERFECT_ZONE_RATIO;
                    if (i === this.currentPlatformIndex + 1) {
                        this.ctx.fillStyle = `hsla(${this.ambientHue}, 60%, 70%, 0.25)`;
                    } else {
                        this.ctx.fillStyle = `hsla(${this.ambientHue}, 50%, 60%, 0.15)`;
                    }
                    this.ctx.fillRect(plat.x + plat.width / 2 - centerW / 2, plat.y, centerW, plat.height);
                }
                
                // Draw player
                this.ctx.save();
                this.ctx.translate(
                    this.player.x + this.player.width / 2,
                    this.player.y + this.player.height / 2
                );
                this.ctx.scale(this.player.scaleX, this.player.scaleY);
                
                // Soft glow
                const playerGlow = this.ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
                playerGlow.addColorStop(0, `hsla(${this.ambientHue}, 70%, 70%, 0.4)`);
                playerGlow.addColorStop(1, 'transparent');
                this.ctx.fillStyle = playerGlow;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 25, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Player body
                this.ctx.fillStyle = `hsl(${this.ambientHue}, 60%, 70%)`;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 11, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Inner light
                this.ctx.fillStyle = 'rgba(255,255,255,0.5)';
                this.ctx.beginPath();
                this.ctx.arc(-3, -3, 4, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Charging arc for zen
                if (this.state === STATE.CHARGING) {
                    const chargeTime = Date.now() - this.chargeStartTime;
                    const ratio = Math.min(chargeTime / CONSTANTS.MAX_CHARGE_TIME, 1);
                    
                    this.ctx.strokeStyle = `hsla(${this.ambientHue}, 80%, 70%, 0.8)`;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 20, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
                    this.ctx.stroke();
                }
                
                this.ctx.restore(); // End player
                this.ctx.restore(); // End camera
                
                // Draw particles
                this.particles.forEach(p => p.draw(this.ctx));
            }
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        const game = new Game();
    </script>
</body>
</html>
