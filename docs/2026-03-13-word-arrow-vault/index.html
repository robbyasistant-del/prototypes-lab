<!doctype html><html lang='es'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Word Arrow Vault</title><style>body{font-family:Inter,Segoe UI,Arial;background:#08111f;color:#e7f3ff;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#122035;border:1px solid #335372;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(5,56px);gap:8px;justify-content:center}.c{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#0d1a2c;border:1px solid #2e4f72;font-weight:700}.p{outline:3px solid #9ad1ff}.goal{background:#163a25}.trap{background:#3e1f2e}.btn{background:#8fd4ff;color:#022032;border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><div class='wrap'><div class='card'><h1>Word Arrow Vault</h1><p>Objetivo: forma la palabra <b>CODE</b> recogiendo letras en orden. Muévete con flechas (↑↓←→). 14 de energía, 2 trampas máximas.</p><p>Score: <span id='score'>0</span> · Energía: <span id='en'>14</span> · Traps: <span id='tr'>0</span>/2 · Badge: <span id='badge'>None</span></p><div id='g' class='grid'></div><p id='msg'>Listo.</p><p id='state'></p><button class='btn' onclick='resetRun()'>New Run</button></div></div><script>const size=5,target=['C','O','D','E'];let idx=0,score=0,en=14,tr=0,done=false,pos={x:0,y:0};const letters=[['C','','','X',''],['','O','','','T'],['','','D','',''],['','B','','E',''],['','','','','']];const traps={'1,4':1,'3,1':1};const g=document.getElementById('g'),msg=document.getElementById('msg'),state=document.getElementById('state');function badge(){if(score>=80)return'Vault Master';if(score>=55)return'Cipher Rider';if(score>=30)return'Arrow Scout';return'None';} function draw(){g.innerHTML='';for(let y=0;y<size;y++)for(let x=0;x<size;x++){const d=document.createElement('div');d.className='c'+(x===pos.x&&y===pos.y?' p':'');const k=`${y},${x}`;if(letters[y][x]){d.textContent=letters[y][x];d.classList.add('goal')}if(traps[k]){d.classList.add('trap')}g.appendChild(d);} scoreEl.textContent=score;enEl.textContent=en;trEl.textContent=tr;badgeEl.textContent=badge();}const scoreEl=document.getElementById('score'),enEl=document.getElementById('en'),trEl=document.getElementById('tr'),badgeEl=document.getElementById('badge');function step(dx,dy){if(done)return;pos.x=Math.max(0,Math.min(4,pos.x+dx));pos.y=Math.max(0,Math.min(4,pos.y+dy));en--;const k=`${pos.y},${pos.x}`;if(traps[k]){tr++;score=Math.max(0,score-8);msg.innerHTML='<span style="color:#ff9ca5">Trap hit! -8</span>';}const c=letters[pos.y][pos.x];if(c&&c===target[idx]){idx++;score+=18;letters[pos.y][pos.x]='';msg.innerHTML='<span style="color:#9dffb8">Letra correcta +18</span>';}else if(c){score=Math.max(0,score-4);msg.innerHTML='<span style="color:#ffcf89">Letra fuera de orden -4</span>';}if(idx===target.length){done=true;state.innerHTML='<b style="color:#8dffb4">WIN</b> · CODE completo. Badge: '+badge();}else if(en<=0||tr>=2){done=true;state.innerHTML='<b style="color:#ff9ca5">GAME OVER</b> · Se acabó energía/margen.';}draw();}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')step(0,-1);if(e.key==='ArrowDown')step(0,1);if(e.key==='ArrowLeft')step(-1,0);if(e.key==='ArrowRight')step(1,0);}); function resetRun(){idx=0;score=0;en=14;tr=0;done=false;pos={x:0,y:0};letters[0][0]='C';letters[1][1]='O';letters[2][2]='D';letters[3][3]='E';msg.textContent='Nueva run.';state.textContent='';draw();}draw();</script></body></html>
