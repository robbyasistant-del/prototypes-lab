<!doctype html><html lang='es'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Piano Pulse Keeper</title><style>body{font-family:Inter,Segoe UI,Arial;background:#0d0a18;color:#f0ebff;margin:0}.wrap{max-width:860px;margin:auto;padding:20px}.card{background:#1a1530;border:1px solid #423069;border-radius:16px;padding:16px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.k{height:82px;border-radius:12px;border:1px solid #5e4a8f;background:#281f45;color:#fff;font-size:26px;font-weight:700;cursor:pointer}.k.on{background:#bfa0ff;color:#1b0e36}.btn{background:#cab4ff;color:#1e0d3e;border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><div class='wrap'><div class='card'><h1>Piano Pulse Keeper</h1><p>Memoriza secuencia y repítela. 5 rounds para WIN. Tienes 3 vidas. Perfect round = bonus + badge progress.</p><p>Round: <span id='r'>1</span>/5 · Score: <span id='s'>0</span> · Lives: <span id='l'>3</span> · Badge: <span id='b'>None</span></p><div class='keys'><button class='k' data-v='0'>♪1</button><button class='k' data-v='1'>♪2</button><button class='k' data-v='2'>♪3</button><button class='k' data-v='3'>♪4</button></div><p id='m'>Pulsa Start round.</p><p id='st'></p><button class='btn' id='start'>Start Round</button> <button class='btn' onclick='resetRun()'>New Run</button></div></div><script>let round=1,score=0,lives=3,seq=[],input=[],playing=false,done=false;const keys=[...document.querySelectorAll('.k')];const r=document.getElementById('r'),s=document.getElementById('s'),l=document.getElementById('l'),b=document.getElementById('b'),m=document.getElementById('m'),st=document.getElementById('st');const bd=()=>score>=95?'Pulse Maestro':score>=60?'Tempo Ace':score>=30?'Beat Rookie':'None';function sync(){r.textContent=round;s.textContent=score;l.textContent=lives;b.textContent=bd();} async function flash(i){const el=keys[i];el.classList.add('on');await new Promise(a=>setTimeout(a,280));el.classList.remove('on');await new Promise(a=>setTimeout(a,120));} async function play(){playing=true;for(const i of seq)await flash(i);playing=false;m.textContent='Tu turno.';} document.getElementById('start').onclick=async()=>{if(done||playing)return;seq=[...Array(round+1)].map(_=>Math.floor(Math.random()*4));input=[];m.textContent='Memoriza...';await play();};keys.forEach(k=>k.onclick=()=>{if(done||playing||seq.length===0)return;const v=+k.dataset.v;input.push(v);k.classList.add('on');setTimeout(()=>k.classList.remove('on'),120);const idx=input.length-1;if(input[idx]!==seq[idx]){lives--;score=Math.max(0,score-7);m.innerHTML='<span style="color:#ff9eb4">Nota incorrecta -7</span>';seq=[];if(lives<=0){done=true;st.innerHTML='<b style="color:#ff9eb4">GAME OVER</b> · sin vidas.';}sync();return;} if(input.length===seq.length){const gain=12+round*2;score+=gain;m.innerHTML='<span style="color:#9dffbf">Round limpio +'+gain+'</span>';if(round>=5){done=true;st.innerHTML='<b style="color:#96ffc0">WIN</b> · cadena completa. Badge: '+bd();}else{round++;}seq=[];sync();}}); function resetRun(){round=1;score=0;lives=3;seq=[];input=[];playing=false;done=false;st.textContent='';m.textContent='Nueva run, pulsa Start round.';sync();}sync();</script></body></html>
