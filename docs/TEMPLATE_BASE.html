<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jumper Game Template</title>
    <style>
        /* ===== CSS RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        :root { 
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg: #EDF2F8;
            --surface: rgba(255, 255, 255, 0.75);
            --text: #0f172a;
            --text-secondary: #64748b;
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 28px 60px rgba(15, 23, 42, 0.22);
        }
        
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* ===== GAME CONTAINER ===== */
        #wrap {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            will-change: transform; 
        }
        
        /* ===== UI LAYER ===== */
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 5;
        }
        
        /* ===== SCORE DISPLAY ===== */
        #score-display {
            position: absolute;
            top: calc(20px + var(--sat));
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            box-shadow: var(--glass-shadow), 0 0 0 4px rgba(255,255,255,0.3);
            text-align: center;
            pointer-events: auto;
        }
        
        #score-display .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--primary);
            opacity: 0.8;
        }
        
        #score-display .value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-top: 2px;
        }
        
        #score-display .best {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        /* ===== PROGRESS BAR ===== */
        #progress-container {
            position: absolute;
            top: calc(90px + var(--sat));
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 6px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        /* ===== MODAL STYLES (Glassmorphism) ===== */
        #modal {
            position: absolute; 
            inset: 0;
            display: flex; 
            align-items: center; 
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
        }
        
        #modal.show { 
            opacity: 1; 
            pointer-events: auto; 
        }
        
        .card {
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 36px 28px 28px;
            text-align: center;
            max-width: 340px; 
            width: 85%;
            box-shadow: var(--glass-shadow), 0 0 0 8px rgba(255,255,255,0.55);
            transform: translateY(16px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        #modal.show .card { 
            transform: translateY(0) scale(1); 
        }
        
        .card h2 {
            font-size: 22px; 
            font-weight: 800;
            color: var(--text); 
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }
        
        .card p {
            font-size: 15px; 
            color: var(--text-secondary);
            margin-bottom: 24px; 
            line-height: 1.5;
        }
        
        .modal-brand {
            font-size: 11px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            text-transform: uppercase; 
            color: var(--primary);
            margin-bottom: 6px;
            opacity: 0.7;
        }
        
        .btn {
            display: block; 
            width: 100%;
            padding: 14px 0; 
            border: none; 
            border-radius: 14px;
            font-size: 16px; 
            font-weight: 700;
            cursor: pointer; 
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s, background 0.2s;
        }
        
        .btn:active { transform: scale(0.96); }
        
        .btn-main { 
            background: var(--primary); 
            color: #fff; 
        }
        
        .btn-main:hover {
            background: var(--primary-dark);
        }
        
        .btn-ghost { 
            background: transparent; 
            color: var(--primary); 
            margin-top: 4px;
        }
        
        /* ===== INSTRUCTIONS OVERLAY ===== */
        #instructions {
            position: absolute;
            bottom: calc(40px + var(--sab));
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
            pointer-events: none;
        }
        
        #instructions .key {
            display: inline-block;
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 4px;
        }
        
        /* ===== DARK MODE ===== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.8);
                --text: #f1f5f9;
                --text-secondary: #94a3b8;
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="gc"></canvas>
        
        <!-- UI Layer -->
        <div id="ui">
            <div id="score-display">
                <div class="label">Score</div>
                <div class="value" id="score">0</div>
                <div class="best">Best: <span id="best">0</span></div>
            </div>
            
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            
            <div id="instructions">
                <span class="key">SPACE</span> or <span class="key">TAP</span> to jump
            </div>
        </div>
        
        <!-- Modal Overlay -->
        <div id="modal">
            <div class="card">
                <div class="modal-brand">Game Over</div>
                <h2 id="modal-title">Try Again!</h2>
                <p id="modal-message">You reached platform <span id="final-score">0</span></p>
                <button class="btn btn-main" id="btn-restart">Play Again</button>
                <button class="btn btn-ghost" id="btn-menu">Menu</button>
            </div>
        </div>
    </div>

    <script>
    /* ════════════════════════════════════════════════════════
       GAME ENGINE TEMPLATE
       Base structure for jumper-style games
       ════════════════════════════════════════════════════════ */
    
    (function() {
        'use strict';
        
        // ===== CONFIGURATION =====
        const CONFIG = {
            GRAVITY: 0.5,
            JUMP_FORCE: -12,
            MOVE_SPEED: 5,
            FRICTION: 0.85,
            PLATFORM_GAP_MIN: 60,
            PLATFORM_GAP_MAX: 120,
            PLATFORM_WIDTH_MIN: 60,
            PLATFORM_WIDTH_MAX: 120,
            CAMERA_SMOOTHING: 0.1,
            COLORS: {
                player: '#6366f1',
                platform: '#0f172a',
                platformActive: '#6366f1',
                background: '#EDF2F8'
            }
        };
        
        // ===== STATE =====
        const state = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            dpr: 1,
            
            // Game state
            isPlaying: false,
            isGameOver: false,
            score: 0,
            bestScore: 0,
            
            // Camera
            camera: { x: 0, y: 0, targetY: 0 },
            
            // Entities
            player: null,
            platforms: [],
            particles: [],
            
            // Input
            keys: {},
            touch: { active: false, x: 0, y: 0 },
            
            // Loop
            lastTime: 0,
            rafId: null
        };
        
        // ===== UTILITY FUNCTIONS =====
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;
        const randInt = (min, max) => Math.floor(rand(min, max));
        
        // ===== CLASSES =====
        
        class Vector2 {
            constructor(x = 0, y = 0) { this.x = x; this.y = y; }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            mult(s) { this.x *= s; this.y *= s; return this; }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = rand(-3, 3);
                this.vy = rand(-5, -2);
                this.life = 1.0;
                this.decay = rand(0.02, 0.05);
                this.color = color;
                this.size = rand(3, 6);
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // gravity
                this.life -= this.decay;
                return this.life > 0;
            }
            
            draw(ctx, camY) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y - camY, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        class Platform {
            constructor(x, y, width) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = 12;
                this.active = true;
                this.bounceAnim = 0;
            }
            
            draw(ctx, camY) {
                const screenY = this.y - camY;
                if (screenY < -50 || screenY > state.height + 50) return;
                
                // Bounce animation
                const bounce = this.bounceAnim > 0 ? Math.sin(this.bounceAnim * Math.PI) * 5 : 0;
                this.bounceAnim = Math.max(0, this.bounceAnim - 0.1);
                
                ctx.fillStyle = this.active ? CONFIG.COLORS.platformActive : CONFIG.COLORS.platform;
                
                // Rounded rect
                const r = 6;
                const x = this.x, y = screenY + bounce, w = this.width, h = this.height;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.fill();
                
                // Glow for active platforms
                if (this.active) {
                    ctx.shadowColor = CONFIG.COLORS.platformActive;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
            
            bounce() {
                this.bounceAnim = 1;
            }
        }
        
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 32;
                this.vx = 0;
                this.vy = 0;
                this.onGround = false;
                this.facing = 1; // 1 = right, -1 = left
            }
            
            update() {
                // Input handling
                if (state.keys['ArrowLeft'] || state.keys['a']) {
                    this.vx -= 1;
                    this.facing = -1;
                }
                if (state.keys['ArrowRight'] || state.keys['d']) {
                    this.vx += 1;
                    this.facing = 1;
                }
                
                // Touch controls
                if (state.touch.active) {
                    const center = state.width / 2;
                    if (state.touch.x < center) {
                        this.vx -= 1;
                        this.facing = -1;
                    } else {
                        this.vx += 1;
                        this.facing = 1;
                    }
                }
                
                // Physics
                this.vx *= CONFIG.FRICTION;
                this.vx = clamp(this.vx, -CONFIG.MOVE_SPEED, CONFIG.MOVE_SPEED);
                
                this.vy += CONFIG.GRAVITY;
                
                this.x += this.vx;
                this.y += this.vy;
                
                // Screen wrap
                if (this.x + this.width < 0) this.x = state.width;
                else if (this.x > state.width) this.x = -this.width;
                
                // Check platform collisions
                this.onGround = false;
                if (this.vy > 0) { // Only when falling
                    for (const plat of state.platforms) {
                        if (!plat.active) continue;
                        if (this.x + this.width > plat.x && 
                            this.x < plat.x + plat.width &&
                            this.y + this.height >= plat.y &&
                            this.y + this.height <= plat.y + plat.height + this.vy + 5) {
                            
                            this.y = plat.y - this.height;
                            this.vy = CONFIG.JUMP_FORCE;
                            this.onGround = true;
                            plat.bounce();
                            
                            // Spawn particles
                            for (let i = 0; i < 5; i++) {
                                state.particles.push(new Particle(
                                    this.x + this.width / 2,
                                    this.y + this.height,
                                    CONFIG.COLORS.platformActive
                                ));
                            }
                            
                            // Score based on height
                            const platformIndex = state.platforms.indexOf(plat);
                            if (platformIndex > state.score) {
                                state.score = platformIndex;
                                updateUI();
                            }
                            break;
                        }
                    }
                }
                
                // Death check
                if (this.y - state.camera.y > state.height + 100) {
                    gameOver();
                }
            }
            
            jump() {
                if (this.onGround || Math.abs(this.vy) < 2) {
                    this.vy = CONFIG.JUMP_FORCE;
                    this.onGround = false;
                }
            }
            
            draw(ctx, camY) {
                const screenY = this.y - camY;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(this.x + this.width/2, screenY + this.height + 5, 
                           this.width/2, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Body
                ctx.fillStyle = CONFIG.COLORS.player;
                const r = 8;
                const x = this.x, y = screenY, w = this.width, h = this.height;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#fff';
                const eyeOffset = this.facing === 1 ? 4 : -4;
                ctx.beginPath();
                ctx.arc(x + w/2 + eyeOffset - 5, y + 10, 4, 0, Math.PI * 2);
                ctx.arc(x + w/2 + eyeOffset + 5, y + 10, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Pupils
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(x + w/2 + eyeOffset - 5 + this.facing * 2, y + 10, 2, 0, Math.PI * 2);
                ctx.arc(x + w/2 + eyeOffset + 5 + this.facing * 2, y + 10, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // ===== GAME FUNCTIONS =====
        
        function init() {
            // Setup canvas
            state.canvas = document.getElementById('gc');
            state.ctx = state.canvas.getContext('2d');
            
            // Load best score
            state.bestScore = parseInt(localStorage.getItem('jumper_best') || '0');
            
            // Event listeners
            setupInput();
            setupUI();
            
            // Initial resize
            resize();
            window.addEventListener('resize', resize);
            
            // Start game
            resetGame();
            gameLoop(0);
        }
        
        function resize() {
            const wrap = document.getElementById('wrap');
            state.width = wrap.clientWidth;
            state.height = wrap.clientHeight;
            state.dpr = Math.min(window.devicePixelRatio || 1, 2);
            
            state.canvas.width = state.width * state.dpr;
            state.canvas.height = state.height * state.dpr;
            state.canvas.style.width = state.width + 'px';
            state.canvas.style.height = state.height + 'px';
            
            state.ctx.scale(state.dpr, state.dpr);
        }
        
        function setupInput() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                state.keys[e.key] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (state.isPlaying && state.player) {
                        state.player.jump();
                    } else if (state.isGameOver) {
                        resetGame();
                    }
                }
            });
            
            window.addEventListener('keyup', (e) => {
                state.keys[e.key] = false;
            });
            
            // Touch
            const handleTouch = (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    state.touch.active = true;
                    state.touch.x = e.touches[0].clientX;
                    state.touch.y = e.touches[0].clientY;
                }
                
                if (state.isPlaying && state.player) {
                    state.player.jump();
                } else if (state.isGameOver) {
                    resetGame();
                }
            };
            
            const handleTouchEnd = () => {
                state.touch.active = false;
            };
            
            state.canvas.addEventListener('touchstart', handleTouch, { passive: false });
            state.canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
            state.canvas.addEventListener('touchend', handleTouchEnd);
            state.canvas.addEventListener('touchcancel', handleTouchEnd);
            
            // Mouse (for desktop testing)
            state.canvas.addEventListener('mousedown', (e) => {
                if (state.isPlaying && state.player) {
                    state.player.jump();
                } else if (state.isGameOver) {
                    resetGame();
                }
            });
        }
        
        function setupUI() {
            document.getElementById('btn-restart').addEventListener('click', resetGame);
            document.getElementById('btn-menu').addEventListener('click', () => {
                // Menu logic here
                hideModal();
            });
        }
        
        function generatePlatforms(startY) {
            state.platforms = [];
            let y = startY;
            
            // Starting platform
            state.platforms.push(new Platform(
                state.width / 2 - 50,
                y,
                100
            ));
            
            // Generate upwards
            for (let i = 0; i < 100; i++) {
                y -= rand(CONFIG.PLATFORM_GAP_MIN, CONFIG.PLATFORM_GAP_MAX);
                const width = rand(CONFIG.PLATFORM_WIDTH_MIN, CONFIG.PLATFORM_WIDTH_MAX);
                const x = rand(20, state.width - width - 20);
                state.platforms.push(new Platform(x, y, width));
            }
        }
        
        function resetGame() {
            state.isPlaying = true;
            state.isGameOver = false;
            state.score = 0;
            state.particles = [];
            state.camera = { x: 0, y: 0, targetY: 0 };
            
            // Create player
            state.player = new Player(state.width / 2 - 16, state.height - 150);
            
            // Generate platforms
            generatePlatforms(state.height - 50);
            
            updateUI();
            hideModal();
        }
        
        function gameOver() {
            state.isPlaying = false;
            state.isGameOver = true;
            
            // Save best score
            if (state.score > state.bestScore) {
                state.bestScore = state.score;
                localStorage.setItem('jumper_best', state.bestScore.toString());
            }
            
            showModal('Game Over!', `You reached platform ${state.score}`, state.score);
        }
        
        function updateUI() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('best').textContent = state.bestScore;
            
            // Update progress bar (assuming 100 platforms as goal)
            const progress = Math.min((state.score / 100) * 100, 100);
            document.getElementById('progress-bar').style.width = progress + '%';
        }
        
        function showModal(title, message, score) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('final-score').textContent = score;
            document.getElementById('modal').classList.add('show');
        }
        
        function hideModal() {
            document.getElementById('modal').classList.remove('show');
        }
        
        function updateCamera() {
            if (!state.player) return;
            
            // Camera follows player upward
            const targetY = state.player.y - state.height * 0.6;
            if (targetY < state.camera.targetY) {
                state.camera.targetY = targetY;
            }
            
            // Smooth camera
            state.camera.y = lerp(state.camera.y, state.camera.targetY, CONFIG.CAMERA_SMOOTHING);
            
            // Don't go below 0
            state.camera.y = Math.min(state.camera.y, 0);
        }
        
        function drawBackground() {
            const ctx = state.ctx;
            const w = state.width;
            const h = state.height;
            
            // Clear
            ctx.fillStyle = CONFIG.COLORS.background;
            ctx.fillRect(0, 0, w, h);
            
            // Grid pattern
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.08)';
            ctx.lineWidth = 1;
            
            const gridSize = 40;
            const offsetY = -state.camera.y % gridSize;
            
            for (let x = 0; x < w; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            
            for (let y = offsetY; y < h; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
        }
        
        function gameLoop(timestamp) {
            const dt = timestamp - state.lastTime;
            state.lastTime = timestamp;
            
            if (state.isPlaying) {
                // Update
                state.player.update();
                
                // Update particles
                state.particles = state.particles.filter(p => p.update());
                
                // Update camera
                updateCamera();
            }
            
            // Draw
            drawBackground();
            
            // Draw platforms
            for (const plat of state.platforms) {
                plat.draw(state.ctx, state.camera.y);
            }
            
            // Draw particles
            for (const p of state.particles) {
                p.draw(state.ctx, state.camera.y);
            }
            
            // Draw player
            if (state.player) {
                state.player.draw(state.ctx, state.camera.y);
            }
            
            state.rafId = requestAnimationFrame(gameLoop);
        }
        
        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', init);
        
    })();
    </script>
</body>
</html>
