<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Sort Sanctuary</title><style>body{margin:0;background:#130f1f;color:#f4eeff;font-family:Inter,Arial}main{max-width:980px;margin:auto;padding:16px}.top{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#2a1f47;padding:6px 10px;border-radius:20px}.board{display:grid;grid-template-columns:repeat(6,60px);gap:8px;justify-content:center;margin:14px 0}.cell{width:60px;height:60px;border-radius:12px;border:1px solid #4f3d7e;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;background:#1a1330}.sel{outline:3px solid #ffc857}.btn{background:#ffc857;border:none;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><main><h1>Star Sort Sanctuary</h1><p>Swap adjacent stars to make lines of 3+ same color. <b>Win:</b> reach target score in 18 moves. <b>Game over:</b> moves hit zero first.</p><div class="top"><div class="pill" id="score">Score:0</div><div class="pill" id="moves">Moves:18</div><div class="pill" id="target">Target:260</div><div class="pill" id="badge">Badge: Calm Sorter</div></div><div id="board" class="board"></div><p id="msg"></p><button id="restart" class="btn" style="display:none">Play again</button></main><script>
const icons=['🔴','🟢','🔵','🟡','🟣']; const n=6; let g=[],sel=-1,score=0,moves=18,target=260,over=false;
const el=id=>document.getElementById(id);
function b(){if(score>=360)return'Nova Curator';if(score>=260)return'Star Keeper';if(score>=140)return'Glow Arranger';return'Calm Sorter'}
function rand(){return Math.floor(Math.random()*icons.length)}
function init(){g=Array.from({length:n*n},rand); while(find().length)collapse(); draw(); ui('Make your first swap.');}
function draw(){const bd=el('board');bd.innerHTML='';g.forEach((v,i)=>{const c=document.createElement('button');c.className='cell'+(sel===i?' sel':'');c.textContent=icons[v];c.onclick=()=>tap(i);bd.appendChild(c);});}
function adj(a,b){const ar=Math.floor(a/n),ac=a%n,br=Math.floor(b/n),bc=b%n; return Math.abs(ar-br)+Math.abs(ac-bc)===1}
function tap(i){if(over)return; if(sel<0){sel=i;draw();return;} if(sel===i){sel=-1;draw();return;} if(!adj(sel,i)){sel=i;draw();return;} const prev=sel; [g[sel],g[i]]=[g[i],g[sel]]; sel=-1; const m=find(); if(!m.length){[g[prev],g[i]]=[g[i],g[prev]]; ui('Invalid swap. Need a match.'); draw(); return;} moves--; resolve(); if(moves<=0 && score<target)return lose('Out of moves.'); if(score>=target)return win(); draw();}
function find(){const mark=new Set(); for(let r=0;r<n;r++){for(let c=0;c<n-2;c++){let a=r*n+c; if(g[a]===g[a+1]&&g[a]===g[a+2]){let k=c; while(k<n&&g[r*n+k]===g[a]){mark.add(r*n+k);k++;}}}} for(let c=0;c<n;c++){for(let r=0;r<n-2;r++){let a=r*n+c; if(g[a]===g[a+n]&&g[a]===g[a+2*n]){let k=r; while(k<n&&g[k*n+c]===g[a]){mark.add(k*n+c);k++;}}}} return [...mark];}
function collapse(){let m=find(); if(!m.length)return 0; score+=m.length*12; m.forEach(i=>g[i]=-1); for(let c=0;c<n;c++){let col=[]; for(let r=n-1;r>=0;r--) if(g[r*n+c]>=0) col.push(g[r*n+c]); for(let r=n-1,p=0;r>=0;r--,p++) g[r*n+c]= p<col.length?col[p]:rand();} return m.length;}
function resolve(){let total=0,c=0; while(true){let x=collapse(); if(!x)break; total+=x;c++;} ui(`Combo x${Math.max(1,c)}! +${total*12} pts`);}
function ui(m=''){el('score').textContent='Score:'+score;el('moves').textContent='Moves:'+moves;el('badge').textContent='Badge: '+b();el('msg').textContent=m;}
function win(){over=true; ui('WIN! Sanctuary restored 🏆'); el('restart').style.display='inline-block';}
function lose(m){over=true; ui('Game over: '+m); el('restart').style.display='inline-block';}
el('restart').onclick=()=>location.reload(); init();
</script></body></html>
