<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100 Jumps - Power Rush</title>
    <!-- 
    ============================================
    VARIANTE A: POWER RUSH
    ============================================
    
    Variación de mecánica:
    - Mantener la base de "charge to jump"
    - Añadir POWER-UPS entre plataformas:
      * Propulsor (salto automático alto)
      * Muelle (rebote extra)
      * Tiempo lento (cámara más lenta)
    - Plataformas especiales con efectos
    - Sistema de combo por plataformas consecutivas sin fallar
    
    Inspirado en:
    - Doodle Jump (power-ups y trampolines)
    - Jetpack Joyride (power-ups temporales)
    
    Objetivo: Aumentar la espectacularidad y sensación de progreso
    ============================================
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        :root { 
            --sat: env(safe-area-inset-top, 0px);
            --primary: #6366f1;
            --accent: #f59e0b;
            --bg: #EDF2F8;
            --surface: rgba(255, 255, 255, 0.75);
            --text: #0f172a;
        }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #wrap { position: fixed; inset: 0; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        
        #score-display {
            position: absolute;
            top: calc(20px + var(--sat));
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px 24px;
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.22);
            text-align: center;
        }
        #score-display .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary); }
        #score-display .value { font-size: 28px; font-weight: 800; color: var(--text); }
        
        #combo-display {
            position: absolute;
            top: calc(100px + var(--sat));
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: var(--accent);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #combo-display.visible { transform: translateX(-50%) scale(1); }
        
        /* Powerup indicator */
        #powerup-indicator {
            position: absolute;
            bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .powerup-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        .powerup-icon.active { opacity: 1; box-shadow: 0 0 20px var(--accent); }
        
        /* Modal */
        #modal {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }
        #modal.show { opacity: 1; pointer-events: auto; }
        .card {
            background: var(--surface);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 36px 28px;
            text-align: center;
            max-width: 340px;
            width: 85%;
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.22);
        }
        .card h2 { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
        .card p { color: #64748b; margin-bottom: 24px; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-main { background: var(--primary); color: #fff; }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="gc"></canvas>
        <div id="ui">
            <div id="score-display">
                <div class="label">Platform</div>
                <div class="value" id="score">0</div>
            </div>
            
            <div id="combo-display">COMBO x<span id="combo-count">0</span>!</div>
            
            <div id="powerup-indicator">
                <div class="powerup-icon" id="icon-jetpack">🚀</div>
                <div class="powerup-icon" id="icon-spring">⬆️</div>
                <div class="powerup-icon" id="icon-slowmo">⏱️</div>
            </div>
        </div>
        <div id="modal">
            <div class="card">
                <h2>Power Rush</h2>
                <p>¡Usa power-ups para llegar más lejos!<br>🚀 Propulsor | ⬆️ Muelle | ⏱️ Tiempo lento</p>
                <button class="btn btn-main" id="btn-start">Jugar</button>
            </div>
        </div>
    </div>

    <script>
    /* VARIANTE A: POWER RUSH - TO IMPLEMENT
     * 
     * Features:
     * - Base: charge-to-jump (como original)
     * - Power-ups aleatorios entre plataformas:
     *   * Jetpack: salto automático alto, inmunidad temporal
     *   * Spring: rebote extra potente
     *   * Slow-mo: tiempo ralentizado para apuntar mejor
     * - Combo system: plataformas seguidas = multiplicador visual
     * - Plataformas especiales de colores con efectos
     */
    
    const canvas = document.getElementById('gc');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
        canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();
    
    document.getElementById('btn-start').addEventListener('click', () => {
        document.getElementById('modal').classList.remove('show');
    });
    document.getElementById('modal').classList.add('show');
    
    // TODO: Implement Power Rush variant
    </script>
</body>
</html>
