<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>100 Jumps - Clone Exacto II</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
    :root{--sat:env(safe-area-inset-top,0px)}
    html,body{width:100%;height:100%;overflow:hidden;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;transition:background .55s ease,color .35s ease;background:#edf2f8}
    #wrap{position:fixed;inset:0;overflow:hidden}
    canvas{display:block;width:100%;height:100%;z-index:1}

    #settings-btn,#stats-btn{position:fixed;top:22px;z-index:9999;width:48px;height:48px;background:rgba(255,255,255,.9);border:2px solid #6366f1;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
    #settings-btn{right:70px}
    #theme-btn{position:fixed;top:22px;right:12px;z-index:9999;width:48px;height:48px;background:rgba(255,255,255,.9);border:2px solid #6366f1;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
    #settings-btn:hover,#stats-btn:hover,#theme-btn:hover{background:#fff;transform:scale(1.05)}
    #theme-btn:active{transform:scale(.88)}
    #theme-btn svg{width:26px;height:26px;fill:#475569;transition:fill .35s ease,transform .3s ease}
    #theme-btn:hover svg{fill:#334155}
    body.theme-dark #theme-btn svg{fill:#cbd5e1}
    body.theme-dark #theme-btn:hover svg{fill:#e2e8f0}
    #version-footer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);padding:3px 10px;background:rgba(255,255,255,.72);border-radius:10px;font-size:11px;font-weight:600;color:#475569;pointer-events:none;z-index:50}
    body.theme-dark #version-footer{background:rgba(15,23,42,.72);color:#cbd5e1}
    #stats-btn{left:12px}
    #settings-btn:active,#stats-btn:active{transform:scale(.88)}
    #settings-btn svg,#stats-btn svg{width:32px;height:32px;fill:#475569;transition:fill .35s ease}

    #modal,#settings-overlay,#stats-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .28s ease}
    #modal.show,#settings-overlay.show,#stats-overlay.show{opacity:1;pointer-events:auto}

    .card{background:#fff;color:#0f172a;border-radius:24px;border:1px solid rgba(99,102,241,.16);padding:28px 24px 20px;text-align:center;max-width:360px;width:90%;box-shadow:0 28px 60px rgba(15,23,42,.22);transform:translateY(16px) scale(.97);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .35s ease,color .35s ease,border-color .35s ease}
    .show .card{transform:translateY(0) scale(1)}
    .card h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:10px}
    .card p{font-size:18px;color:#64748b;margin-bottom:18px}

    .btn{display:block;width:100%;padding:13px 0;border:none;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s ease,filter .2s ease}
    .btn:active{transform:scale(.96)}
    .btn-main{background:#6366f1;color:#fff}
    .btn-soft{margin-top:8px;background:rgba(99,102,241,.12);color:#4f46e5}

    .toggle-row,.select-row,.slider-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
    .toggle-row+.toggle-row,.select-row,.slider-row,.leaderboard{border-top:1px solid #e2e8f0}
    .toggle-label{font-size:14px;font-weight:700;color:#334155}
    .toggle{position:relative;width:48px;height:28px;border-radius:14px;background:#cbd5e1;border:none;cursor:pointer;transition:background .2s}
    .toggle.on{background:#6366f1}
    .toggle:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s}
    .toggle.on:after{transform:translateX(20px)}

    select{font-size:14px;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#334155;max-width:58%}
    .vol-slider{-webkit-appearance:none;appearance:none;width:130px;height:6px;background:#e2e8f0;border-radius:999px}
    .vol-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#6366f1}

    .stats-scroll{max-height:74vh;overflow:auto}
    .stats-title{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#94a3b8;text-align:center;margin:12px 0 8px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:8px;border-radius:12px;background:#f8fafc;text-align:center}
    .stat .v{font-size:20px;font-weight:900;color:#0f172a}
    .stat .l{font-size:10px;font-weight:700;color:#94a3b8}

    .ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
    .ach{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;background:#f1f5f9;font-size:10px;font-weight:700;color:#64748b;transition:transform .15s ease,filter .15s ease}
    .ach i{font-size:22px;line-height:1;margin-bottom:4px;font-style:normal}
    .ach:not(.lock){background:#fef9c3;color:#854d0e}
    .ach.lock{filter:grayscale(1);opacity:.45}
    .ach b{display:block;font-size:10px;margin-top:4px;line-height:1.2}

    .leaderboard{padding:12px 0}
    .row{display:flex;justify-content:space-between;font-size:12px;color:#475569;padding:3px 0;font-variant-numeric:tabular-nums}

    body.theme-dark{background:#111827}
    body.theme-dark .card{background:#1e293b;color:#f1f5f9;border-color:#334155}
    body.theme-dark .card p,body.theme-dark .toggle-label,.theme-dark .row{color:#94a3b8}
    body.theme-dark .toggle-row+.toggle-row,body.theme-dark .select-row,body.theme-dark .slider-row,body.theme-dark .leaderboard{border-top-color:#334155}
    body.theme-dark .stat{background:#0f172a}
    body.theme-dark .stat .v{color:#f1f5f9}
    body.theme-dark #settings-btn svg,body.theme-dark #stats-btn svg{fill:#cbd5e1}
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="gc"></canvas>
</div>
<button id="settings-btn" aria-label="Settings"><span style="font-size:28px">⚙️</span></button>
<button id="theme-btn" aria-label="Toggle Theme" title="Toggle Light/Dark"><span id="theme-icon" style="font-size:26px">☀️</span></button>
<button id="stats-btn" aria-label="Stats"><span style="font-size:28px">🏆</span></button>

  <div id="settings-overlay"><div class="card">
    <h2>Settings</h2>
    <div class="toggle-row"><span class="toggle-label">Sounds</span><button class="toggle on" id="tog-sound"></button></div>
    <div class="slider-row" id="vol-row"><span class="toggle-label">Volume</span><input class="vol-slider" type="range" id="vol-slider" min="0" max="100" value="80" /></div>
    <div class="toggle-row"><span class="toggle-label">Ambience</span><button class="toggle" id="tog-amb"></button></div>
    <div class="toggle-row"><span class="toggle-label">Vibration</span><button class="toggle on" id="tog-vib"></button></div>
    <div class="select-row"><span class="toggle-label">Theme</span><select id="theme-select"></select></div>
    <div class="select-row"><span class="toggle-label">Mode</span><select id="mode-select"></select></div>
    <button class="btn btn-main" id="settings-done">Done</button>
  </div></div>

  <div id="stats-overlay"><div class="card stats-scroll">
    <h2>Stats · Leaderboard</h2>
    <div class="stats-title">Current Run</div>
    <div class="grid2"><div class="stat"><div class="v" id="run-jumps">0</div><div class="l">Jumps cleared</div></div><div class="stat"><div class="v" id="run-time">0.0s</div><div class="l">Time</div></div></div>

    <div class="stats-title">Achievements (12)</div>
    <div class="ach-grid" id="ach-grid"></div>

    <div class="stats-title">Leaderboard</div>
    <div class="leaderboard" id="lb-list"></div>
    <button class="btn btn-soft" id="share-copy">Copy Score</button>
    <button class="btn btn-soft" id="share-x">Share on Twitter</button>
    <button class="btn btn-main" id="stats-done" style="margin-top:12px">Done</button>
  </div></div>

  <div id="modal"><div class="card">
    <h2 id="mt"></h2>
    <p id="ms"></p>
    <button class="btn btn-main" id="mb"></button>
    <button class="btn btn-soft" id="mb-share" style="display:none">Share Result</button>
  </div></div>
</div>
</div>
<div id="version-footer">100 Jumps II - v<span id="version-hash">--</span></div>

<script>
const THEME_PRESETS = {
  light:{bg:'#edf2f8',platform:'#9aa8bd',score:'#23304d',dim:'#94a3b8',perfect:'#24c78b',life:'#ff5b78',char:'#6366f1',pupil:'#312e81'},
  dark:{bg:'#111827',platform:'#4b5563',score:'#e2e8f0',dim:'#64748b',perfect:'#34d399',life:'#fb7185',char:'#7c83ff',pupil:'#dbeafe'},
  neon:{bg:'#05040a',platform:'#6d28d9',score:'#22d3ee',dim:'#a855f7',perfect:'#10f0a0',life:'#ff4d9d',char:'#00e5ff',pupil:'#ff4dff'},
  sunset:{bg:'linear-gradient(180deg,#ff8a5b 0%,#ff4f8b 100%)',platform:'#fb7185',score:'#fff7ed',dim:'#ffe4e6',perfect:'#fde047',life:'#7f1d1d',char:'#f97316',pupil:'#7c2d12'},
  forest:{bg:'#1f3a2b',platform:'#6f4e37',score:'#ecfccb',dim:'#bbf7d0',perfect:'#86efac',life:'#fca5a5',char:'#22c55e',pupil:'#14532d'},
  ocean:{bg:'#0c4a6e',platform:'#0891b2',score:'#e0f2fe',dim:'#7dd3fc',perfect:'#67e8f9',life:'#fda4af',char:'#38bdf8',pupil:'#0f172a'},
  cyberpunk:{bg:'#2a1042',platform:'#d946ef',score:'#fde047',dim:'#f0abfc',perfect:'#22d3ee',life:'#fb7185',char:'#e879f9',pupil:'#fef08a'}
};
const MODES = {
  classic:{name:'Classic',target:100,noFail:false,diff:1,timeAttack:false},
  zen:{name:'Zen',target:Infinity,noFail:true,diff:.88,timeAttack:false},
  time:{name:'Time Attack',target:100,noFail:false,diff:1,timeAttack:true},
  hardcore:{name:'Hardcore',target:100,noFail:false,diff:1.15,timeAttack:false}
};
const ACH=[{id:'first',name:'First Jump',icon:'🐣',desc:'Clear your first jump'},{id:'ten',name:'Tenacious',icon:'🔟',desc:'Clear 10 jumps in one run'},{id:'fifty',name:'Halfway',icon:'🌓',desc:'Clear 50 jumps in one run'},{id:'century',name:'Century',icon:'💯',desc:'Clear all 100 jumps'},{id:'perfect10',name:'Perfectionist',icon:'🎯',desc:'Land 10 perfect jumps in one run'},{id:'zoned',name:'In the Zone',icon:'🧘',desc:'Get 5 perfect jumps in a row'},{id:'speedster',name:'Speedster',icon:'⚡',desc:'Clear 100 jumps in under 60 seconds'},{id:'zenMaster',name:'Zen Master',icon:'☯️',desc:'Play 5 minutes in Zen mode'},{id:' collector',name:'Collector',icon:'🏆',desc:'Unlock all themes'},{id:'nightOwl',name:'Night Owl',icon:'🦉',desc:'Play after midnight'},{id:'earlyBird',name:'Early Bird',icon:'🐦',desc:'Play before 6am'},{id:'marathon',name:'Marathon',icon:'🏃',desc:'Make 500 total jumps'}];

let canvas=document.getElementById('gc'),ctx=canvas.getContext('2d'),W,H,S,cam={x:0,y:0},platforms=[],player,particles=[],floatTexts=[],runEnd=false,firstTs=0,lastTs=0,score={cleared:0,remaining:100},mode='classic',theme='light',lives=0,streak=0,settings={sound:true,ambience:false,vibration:true,volume:.8,theme:'light',mode:'classic'},stats={attempts:0,best:{classic:0,zen:0,time:0,hardcore:0},ach:{},leaderboard:{classic:[],zen:[],time:[],hardcore:[]}};

try{const s=JSON.parse(localStorage.getItem('100j2_stats'));if(s)stats=s;}catch(_){}
try{const s=JSON.parse(localStorage.getItem('100j2_settings'));if(s)settings=s;}catch(_){}

const ui={togSound:document.getElementById('tog-sound'),togAmb:document.getElementById('tog-amb'),togVib:document.getElementById('tog-vib'),vol:document.getElementById('vol-slider'),volRow:document.getElementById('vol-row'),themeSel:document.getElementById('theme-select'),modeSel:document.getElementById('mode-select'),settingsOverlay:document.getElementById('settings-overlay'),statsOverlay:document.getElementById('stats-overlay'),achGrid:document.getElementById('ach-grid'),lb:document.getElementById('lb-list'),runJumps:document.getElementById('run-jumps'),runTime:document.getElementById('run-time'),mt:document.getElementById('mt'),ms:document.getElementById('ms'),mb:document.getElementById('mb'),mbShare:document.getElementById('mb-share'),modal:document.getElementById('modal')};

Object.keys(THEME_PRESETS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k[0].toUpperCase()+k.slice(1);ui.themeSel.appendChild(o);});
Object.keys(MODES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=MODES[k].name;ui.modeSel.appendChild(o);});

function save(){try{localStorage.setItem('100j2_settings',JSON.stringify(settings));localStorage.setItem('100j2_stats',JSON.stringify(stats));}catch(_){}}
function modeCfg(){return MODES[mode];}
function applyTheme(t){theme=t;settings.theme=t;canvas.style.background=THEME_PRESETS[t].bg;}

function reset(){runEnd=false;firstTs=performance.now();lastTs=0;score.cleared=0;score.remaining=modeCfg().target===Infinity?0:modeCfg().target;lives=0;streak=0;cam.x=0;cam.y=0;platforms=[];player={x:100*S,y:300*S,w:27*S,h:27*S,vx:0,vy:0,charge:0,idx:0,state:'idle'};particles=[];floatTexts=[];genPlat(0,300*S,150*S);for(let i=1;i<101;i++){const w=Math.max(60*S,150*S-i*S);const d=Math.min(400*S,100*S+i*2*S);const prev=platforms[i-1];const x=prev.x+prev.w/2+d+Math.random()*50*S;const y=300*S+Math.sin(i*.7)*80*S;genPlat(i,x,y,w);}player.x=platforms[0].x+platforms[0].w/2-player.w/2;player.y=platforms[0].y-player.h;}
function genPlat(i,x,y,w=150*S){platforms[i]={x,y,w,h:12*S,idx:i,appear:0};}

function resize(){W=innerWidth;H=innerHeight;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);S=Math.min(W,H)/600;reset();}

function update(dt){if(runEnd)return;const p=player,pl=platforms[p.idx+1];if(p.state==='idle'){if(!input.down&&input.wasDown){let power=Math.min(p.charge,1);p.vx=(pl.x+pl.w/2-(p.x+p.w/2))*.03;p.vy=-550*S*power;p.state='jumping';p.charge=0;sfxJump();}if(input.down){p.charge+=dt*1.5;}else{p.charge=0;}}else if(p.state==='jumping'||p.state==='falling'){p.vy+=dt*1400*S;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;if(p.vy>0)p.state='falling';if(p.vy>0&&p.y+p.h>=pl.y&&p.y+p.h<=pl.y+pl.h+10*S&&p.x+p.w>pl.x&&p.x<pl.x+pl.w){const cx=p.x+p.w/2,pcx=pl.x+pl.w/2,dist=Math.abs(cx-pcx),perfect=dist<=pl.w*.11;let quality=perfect?'perfect':dist<=pl.w*.25?'good':dist<=pl.w*.4?'safe':'close';if(quality==='close'){fail();return;}score.cleared++;score.remaining--;streak=perfect?streak+1:0;if(perfect){lives++;sfxPerfect();addFloatText('Perfect!',p.x,p.y-40*S,THEME_PRESETS[theme].perfect);}else{sfxLand();}if(streak%3===0&&streak>0){lives++;addFloatText('+1 LIFE',p.x+13*S,p.y-40*S,'#ff5b78',18);}p.idx++;p.state='idle';p.vx=0;p.vy=0;p.x=pl.x+pl.w/2-p.w/2;p.y=pl.y-p.h;cam.x=p.x-W/3;spawnDust(p.x+p.w/2,p.y+p.h);if(quality==='perfect')spawnConfetti(p.x+p.w/2,p.y);}if(p.y>H+90*S){if(lives>0){lives--;failCount++;sfxLose();addFloatText('-1 LIFE',p.x+13*S,p.y-40*S,'#ff5b78',18);p.state='idle';p.vx=0;p.vy=0;p.x=platforms[p.idx].x+platforms[p.idx].w/2-p.w/2;p.y=platforms[p.idx].y-p.h;}else{fail();}}}input.wasDown=input.down;updateParticles(dt);updateFloatTexts(dt);}
function fail(){runEnd=true;stats.attempts++;if(score.cleared>stats.best[mode])stats.best[mode]=score.cleared;save();endRun(false);}

function endRun(victory){ui.mt.textContent=victory?'Victory!':'Game Over';ui.ms.textContent=victory?`You cleared 100 jumps in ${((performance.now()-firstTs)/1000).toFixed(1)}s`:`You reached ${score.cleared} jumps`;ui.mb.textContent=victory?'Play Again':'Retry';ui.mbShare.style.display=victory?'block':'none';ui.modal.classList.add('show');save();}

function drawBg(){const t=THEME_PRESETS[theme];if(t.bg.startsWith('linear')){const g=ctx.createLinearGradient(0,0,0,H);const parts=t.bg.match(/#[a-f0-9]+/gi);g.addColorStop(0,parts[0]);g.addColorStop(1,parts[1]);ctx.fillStyle=g;}else{ctx.fillStyle=t.bg;}ctx.fillRect(0,0,W,H);}
function drawPlat(p){const t=THEME_PRESETS[theme];ctx.fillStyle=t.platform;const x=p.x-cam.x,y=p.y-cam.y,w=p.w*Math.min(1,p.appear),h=p.h;rr(ctx,x,y,w,h,4*S);ctx.fill();}
function drawPlayer(){const t=THEME_PRESETS[theme],p=player,x=p.x-cam.x,y=p.y-cam.y,w=p.w,h=p.h,sx=w/27,sy=h/27;ctx.save();ctx.translate(x+w/2,y+h);ctx.scale(sx,sy);ctx.fillStyle=t.char;rr(ctx,-13.5,-27,27,27,6);ctx.fill();const eyeR=t.pupil;ctx.fillStyle=eyeR;ctx.beginPath();ctx.arc(-5,-14,3,0,Math.PI*2);ctx.arc(5,-14,3,0,Math.PI*2);ctx.fill();if(p.state==='idle'&&p.charge>0.3){ctx.strokeStyle=eyeR;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-7,-19);ctx.lineTo(-3,-19);ctx.moveTo(3,-19);ctx.lineTo(7,-19);ctx.stroke();}ctx.restore();}
function drawHUD(){const t=THEME_PRESETS[theme];ctx.textAlign='center';ctx.textBaseline='top';ctx.font=`900 ${38*S}px system-ui`;const top=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')||'0')+26*S;const val=mode==='zen'?score.cleared:(modeCfg().target===Infinity?score.cleared:score.remaining);ctx.fillStyle=t.score;ctx.fillText(val,W/2,top);ctx.font=`700 ${11*S}px system-ui`;ctx.fillStyle=t.dim;ctx.fillText(mode==='zen'?'jumps chilled':'jumps '+(mode==='time'?'remaining':'remaining'),W/2,top+41*S);ctx.font=`800 ${14*S}px system-ui`;ctx.fillStyle='#ff5b78';ctx.fillText(lives>0?'♥'.repeat(lives):'',W/2,top+56*S);if(streak>0){ctx.fillStyle=t.perfect;ctx.fillText(`Perfect x${streak}`,W/2,top+71*S);}}

function render(){drawBg();const curIdx=player.idx;for(let i=0;i<=curIdx+1;i++){if(platforms[i]){if(i===curIdx+1&&platforms[i].appear<1)platforms[i].appear=Math.min(1,platforms[i].appear+0.016*4);drawPlat(platforms[i]);}}drawParticles();drawPlayer();drawFloatTexts();drawHUD();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath()}

function loop(ts){if(!lastTs)lastTs=ts;const dt=(ts-lastTs)/1000;lastTs=ts;if(!runEnd)update(dt);render();requestAnimationFrame(loop);}

let input={down:false,wasDown:false};function down(e){input.down=true;e.preventDefault();}function up(e){input.down=false;e.preventDefault();}

function sh(el,fn){el.addEventListener('click',e=>{e.stopPropagation();fn(e);});el.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();fn(e);},{passive:false});}
function syncUI(){ui.togSound.classList.toggle('on',settings.sound);ui.togVib.classList.toggle('on',settings.vibration);ui.togAmb.classList.toggle('on',settings.ambience);ui.vol.value=Math.round(settings.volume*100);ui.volRow.style.display=settings.sound?'flex':'none';ui.themeSel.value=settings.theme;ui.modeSel.value=settings.mode;}
function renderStats(){ui.runJumps.textContent=score.cleared;ui.runTime.textContent=((performance.now()-firstTs)/1000).toFixed(1)+'s';ui.achGrid.innerHTML='';ACH.forEach(a=>{const d=document.createElement('div');d.className='ach'+(stats.ach[a.id]?'':' lock');d.title=a.desc;d.innerHTML=`<i>${a.icon}</i><b>${a.name}</b>`;ui.achGrid.appendChild(d);});const lb=stats.leaderboard[mode]||[];ui.lb.innerHTML=lb.length?lb.map((r,i)=>`<div class="row"><span>#${i+1} ${new Date(r.t).toLocaleDateString()}</span><span>${r.j} jumps - ${r.time.toFixed(1)}s</span></div>`).join(''):'<div class="row"><span>No scores yet</span><span>Play now!</span></div>';}

sh(document.getElementById('settings-btn'),()=>{syncUI();ui.settingsOverlay.classList.add('show');});
sh(document.getElementById('settings-done'),()=>{ui.settingsOverlay.classList.remove('show');});
sh(document.getElementById('stats-btn'),()=>{renderStats();ui.statsOverlay.classList.add('show');});
sh(document.getElementById('stats-done'),()=>ui.statsOverlay.classList.remove('show'));
sh(ui.togSound,()=>{settings.sound=!settings.sound;syncUI();save();});
sh(ui.togVib,()=>{settings.vibration=!settings.vibration;syncUI();save();});
sh(ui.togAmb,()=>{settings.ambience=!settings.ambience;syncUI();save();});
ui.vol.addEventListener('input',()=>{settings.volume=parseInt(ui.vol.value,10)/100;save();});
ui.themeSel.addEventListener('change',()=>{applyTheme(ui.themeSel.value);save();});
ui.modeSel.addEventListener('change',()=>{mode=ui.modeSel.value;settings.mode=mode;save();reset();});

/* Boton de tema Light/Dark */
const themeBtn=document.getElementById('theme-btn');
const themeIcon=document.getElementById('theme-icon');
let isDarkTheme=false;
try{isDarkTheme=localStorage.getItem('100j2_darktheme')==='true';}catch(_){}
function updateThemeIcon(){themeIcon.textContent=isDarkTheme?'🌙':'☀️';document.body.classList.toggle('theme-dark',isDarkTheme);}
function toggleTheme(){isDarkTheme=!isDarkTheme;try{localStorage.setItem('100j2_darktheme',isDarkTheme);}catch(_){}updateThemeIcon();}
sh(themeBtn,toggleTheme);
updateThemeIcon();

applyTheme(settings.theme||'light');mode=settings.mode||'classic';syncUI();
document.getElementById('version-hash').textContent='2026.03.15-2';
setTimeout(()=>{reset();requestAnimationFrame(loop);},50);

['mousedown','touchstart'].forEach(ev=>canvas.addEventListener(ev,down,{passive:false}));
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>canvas.addEventListener(ev,up,{passive:false}));
