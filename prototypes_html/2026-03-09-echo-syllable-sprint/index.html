
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Syllable Sprint</title>
<style>body{margin:0;font-family:Inter,Segoe UI,Arial;background:#091325;color:#eef4ff}.wrap{max-width:920px;margin:0 auto;padding:16px}.p{background:#111f3f;border:1px solid #31508f;border-radius:14px;padding:12px;margin-bottom:10px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chip{padding:12px;border-radius:10px;border:1px solid #4770bf;background:#1a2e63;color:#fff;font-weight:900;cursor:pointer}.chip.ok{background:#20583f}.chip.bad{background:#6b2a3d}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.k{background:#102047;border:1px solid #34589f;border-radius:10px;padding:8px;text-align:center}button,a{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;text-decoration:none}.b{background:linear-gradient(140deg,#87bfff,#698fff);color:#07112f}.g{background:#121f40;color:#dce7ff;border:1px solid #4a6ab4}input{padding:10px;border-radius:8px;border:1px solid #4567ac;background:#0d1936;color:#fff;width:100%;font-size:18px}</style></head><body><div class="wrap">
<div class="p"><h1>Echo Syllable Sprint</h1><p><b>C?mo jugar:</b> En cada ronda elige 3 s?labas para formar una palabra objetivo. Tienes 7 rondas. Error resta vida. <b>Win:</b> completar 7 rondas. <b>Game over:</b> 0 vidas o tiempo.</p>
<div class="hud"><div class="k">Ronda<br><b id="round">1/7</b></div><div class="k">Score<br><b id="score">0</b></div><div class="k">Vidas<br><b id="lives">3</b></div><div class="k">Combo<br><b id="combo">0</b></div><div class="k">Tiempo<br><b id="time">95</b>s</div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button id="start" class="b">Start</button><button id="clear" class="g">Clear</button><button id="submit" class="b">Submit Word</button><a class="g" href="./report.html">Open report</a></div>
<p id="target">Target: ---</p><input id="build" readonly value=""/><p id="fb">Pulsa Start.</p></div>
<div class="p"><div id="chips" class="chips"></div></div><div class="p"><p id="result">Sin run.</p></div></div>
<script>
const R=[['PA','NE','LA','PA?UELA'],['SO','LI','TA','SOLITA'],['MU','SI','CA','MUSICA'],['CO','LO','RES','COLORES'],['AR','MO','NIA','ARMONIA'],['CRU','ZA','DO','CRUZADO'],['RA','PID','EZ','RAPIDEZ']];
let S={live:false,r:1,score:0,lives:3,combo:0,time:95,selected:[],timer:null};const $=id=>document.getElementById(id);
function pickSet(){const row=R[S.r-1];const target=row[3];const pool=[row[0],row[1],row[2],'NEO','TRI','LUX','ZEN'];return {target,pool:pool.sort(()=>Math.random()-.5),parts:[row[0],row[1],row[2]]}}
let C;
function render(){$('round').textContent=`${S.r}/7`;$('score').textContent=S.score;$('lives').textContent=S.lives;$('combo').textContent=S.combo;$('time').textContent=S.time;$('build').value=S.selected.join('');$('target').textContent='Target: '+C.target;const ch=$('chips');ch.innerHTML='';C.pool.forEach((p,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>{if(!S.live)return;S.selected.push(p);$('build').value=S.selected.join('')};ch.appendChild(b)});}
function msg(t,ok=true){$('fb').textContent=t;$('fb').style.color=ok?'#7ef0b9':'#ff9ca8'}
function next(){S.r++;if(S.r>7)return end(true,'Reto ling??stico completo');C=pickSet();S.selected=[];render();}
function submit(){if(!S.live)return;const formed=S.selected.join('').toUpperCase();if(formed===C.target){S.score+=30+S.combo*5;S.combo++;msg('Correcto +score',true);next()}else{S.lives--;S.combo=0;S.score=Math.max(0,S.score-8);msg('No coincide con target',false);if(S.lives<=0)return end(false,'Sin vidas');S.selected=[];render();}}
function start(){S={live:true,r:1,score:0,lives:3,combo:0,time:95,selected:[],timer:null};C=pickSet();clearInterval(S.timer);S.timer=setInterval(()=>{if(!S.live)return;S.time--;if(S.time<=0)end(false,'Tiempo agotado');$('time').textContent=S.time},1000);$('result').textContent='Run activo';msg('Forma la palabra exacta por s?labas',true);render()}
function end(win,why){S.live=false;clearInterval(S.timer);$('result').textContent=`${win?'?? WIN':'?? GAME OVER'} ? ${why}. Score ${S.score}. Badge: ${S.score>=240?'Gold Linguist':'Silver Linguist'}`;msg(win?'Excelente precisi?n':'Try again',win)}
$('start').onclick=start;$('clear').onclick=()=>{S.selected=[];$('build').value=''};$('submit').onclick=submit;C=pickSet();render();
</script></body></html>
