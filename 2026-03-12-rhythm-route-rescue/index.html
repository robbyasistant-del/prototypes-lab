<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Route Rescue</title><style>body{margin:0;background:#07151c;color:#e9fbff;font-family:Inter,Arial}main{max-width:920px;margin:auto;padding:16px}.laneWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.lane{background:#0f2733;border:1px solid #2f6a84;border-radius:12px;min-height:280px;position:relative;overflow:hidden}.hit{position:absolute;bottom:10px;left:10px;right:10px;height:38px;border:2px solid #9de8ff;border-radius:8px;display:flex;align-items:center;justify-content:center}.note{position:absolute;left:50%;transform:translateX(-50%);font-size:24px}.pill{background:#113444;padding:5px 10px;border-radius:20px;margin-right:6px;display:inline-block}.btns button{margin-right:8px;background:#62d8ff;border:none;padding:10px 12px;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><main><h1>Rhythm Route Rescue</h1><p>Keys: A (left), S (mid), D (right). Hit notes inside hit zone. <b>Win:</b> rescue 18 drones. <b>Game over:</b> 8 misses or song end without target.</p><div><span class="pill" id="score">Score:0</span><span class="pill" id="rescued">Rescued:0/18</span><span class="pill" id="miss">Misses:0/8</span><span class="pill" id="time">Time:60</span><span class="pill" id="badge">Badge: Cadet</span></div><div class="laneWrap" id="lanes"></div><p id="feed"></p><div class="btns"><button id="start">Start run</button><button id="restart" style="display:none">Restart</button></div></main><script>
const lanesEl=document.getElementById('lanes'); lanesEl.innerHTML=[0,1,2].map(i=>`<div class="lane" data-i="${i}"><div class="hit">${['A','S','D'][i]}</div></div>`).join('');
let notes=[],running=false,score=0,rescued=0,miss=0,t=60,spawnInt,loopInt,timerInt;
const lanes=[...document.querySelectorAll('.lane')], feed=document.getElementById('feed');
const ui=msg=>{document.getElementById('score').textContent='Score:'+score;document.getElementById('rescued').textContent=`Rescued:${rescued}/18`;document.getElementById('miss').textContent=`Misses:${miss}/8`;document.getElementById('time').textContent='Time:'+t;document.getElementById('badge').textContent='Badge:'+ (score>=220?'Route Captain':score>=140?'Beat Pilot':score>=60?'Pulse Driver':'Cadet'); if(msg)feed.textContent=msg;}
function spawn(){const lane=Math.floor(Math.random()*3); const n=document.createElement('div'); n.className='note'; n.textContent='◆'; n.style.top='-20px'; lanes[lane].appendChild(n); notes.push({lane,y:-20,el:n,hit:false});}
function step(){notes.forEach(o=>{o.y+=6;o.el.style.top=o.y+'px';}); notes.filter(o=>!o.hit&&o.y>250).forEach(o=>{o.hit=true;miss++;score=Math.max(0,score-6);o.el.remove();ui('Miss ❌');}); notes=notes.filter(o=>o.el.isConnected); if(miss>=8)end(false,'Too many misses.');}
function press(k){if(!running)return; const map={a:0,s:1,d:2}; const lane=map[k]; if(lane===undefined)return; const cand=notes.filter(o=>o.lane===lane&&!o.hit).sort((a,b)=>b.y-a.y)[0]; if(cand && cand.y>206 && cand.y<258){cand.hit=true; cand.el.remove(); rescued++; score+=14; ui('Perfect hit ✅'); if(rescued>=18)end(true,'All drones rescued!');} else {miss++; score=Math.max(0,score-4); ui('Off-beat ⚠️'); if(miss>=8)end(false,'Too many misses.');}}
function end(win,msg){if(!running)return;running=false; clearInterval(spawnInt); clearInterval(loopInt); clearInterval(timerInt); ui((win?'WIN! ':'Game over: ')+msg); document.getElementById('restart').style.display='inline-block';}
function start(){if(running)return; running=true; score=0;rescued=0;miss=0;t=60;notes.forEach(n=>n.el.remove());notes=[]; ui('Run started.'); spawnInt=setInterval(spawn,850); loopInt=setInterval(step,80); timerInt=setInterval(()=>{t--;ui(); if(t<=0) end(rescued>=18,'Time finished.');},1000);}
document.getElementById('start').onclick=start; document.getElementById('restart').onclick=()=>location.reload(); document.addEventListener('keydown',e=>press(e.key.toLowerCase())); ui('Press Start, then use A/S/D.');
</script></body></html>
