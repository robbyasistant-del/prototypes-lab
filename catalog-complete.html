    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-hover: #1e2a4a;
            --accent-primary: #e94560;
            --accent-secondary: #0f3460;
            --accent-gold: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #2a2a4a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 30px rgba(233, 69, 96, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--accent-secondary) 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 3px solid var(--accent-primary);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text-primary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Stats Bar */
        .stats-bar {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Controls Section */
        .controls {
            background: var(--bg-secondary);
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        /* Main Content */
        .main-content {
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-primary);
        }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-header .count {
            background: var(--accent-primary);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        /* Game Card */
        .game-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-gold));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-primary);
            background: var(--bg-card-hover);
        }

        .game-card:hover::before {
            transform: scaleX(1);
        }

        .game-card.hidden {
            display: none;
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            text-align: center;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
            line-height: 1.3;
        }

        .game-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .game-date::before {
            content: "📅";
        }

        /* Rating Stars */
        .rating-container {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            margin-bottom: 1rem;
        }

        .star {
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #444;
            user-select: none;
        }

        .star:hover,
        .star.active {
            color: var(--accent-gold);
            transform: scale(1.2);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .star:hover {
            filter: brightness(1.3);
        }

        /* Play Button */
        .play-btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-primary), #ff6b6b);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .play-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.5);
        }

        .play-btn::before {
            content: "▶";
        }

        /* 100 Jumps Special Styling */
        .game-card.hundred-jumps::after {
            content: "100 Jumps";
            position: absolute;
            top: 10px;
            right: -30px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.3rem 2rem;
            transform: rotate(45deg);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }

        /* Scroll to Top */
        .scroll-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats-bar {
                gap: 1.5rem;
                padding: 1rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            .filter-buttons {
                gap: 0.3rem;
            }

            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Loading shimmer */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>

        ];

        // Initialize ratings from localStorage
        let ratings = {};
        try {
            const saved = localStorage.getItem('gameRatings');
            if (saved) {
                ratings = JSON.parse(saved);
            }
        } catch (e) {
            console.warn('localStorage not available');
        }

        // Current filter
        let currentFilter = 'all';
        let searchQuery = '';

        // Save ratings to localStorage
        function saveRatings() {
            try {
                localStorage.setItem('gameRatings', JSON.stringify(ratings));
            } catch (e) {
                console.warn('Could not save ratings');
            }
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const ratedGames = Object.keys(ratings).filter(id => ratings[id] > 0);
            const ratedCount = ratedGames.length;
            const totalRating = ratedGames.reduce((sum, id) => sum + ratings[id], 0);
            const avgRating = ratedCount > 0 ? (totalRating / ratedCount).toFixed(1) : '-';
            
            document.getElementById('ratedCount').textContent = ratedCount;
            document.getElementById('unratedCount').textContent = games.length - ratedCount;
            document.getElementById('avgRating').textContent = avgRating;
        }

        // Create star rating HTML
        function createStarRating(gameId, currentRating) {
            let html = '<div class="rating-container">';
            for (let i = 1; i <= 4; i++) {
                const active = i <= currentRating ? 'active' : '';
                html += `<span class="star ${active}" data-game="${gameId}" data-rating="${i}" onclick="rateGame('${gameId}', ${i})">★</span>`;
            }
            html += '</div>';
            return html;
        }

        // Rate a game
        function rateGame(gameId, rating) {
            ratings[gameId] = rating;
            saveRatings();
            renderGames();
        }

        // Create game card HTML
        function createGameCard(game) {
            const rating = ratings[game.id] || 0;
            const hundredJumpsClass = game.isHundredJumps ? 'hundred-jumps' : '';
            const folderName = game.isHundredJumps ? game.id : game.id;
            
            return `
                <div class="game-card ${hundredJumpsClass}" data-id="${game.id}" data-name="${game.name.toLowerCase()}" data-month="${game.month}" data-rated="${rating > 0}" data-hundredjumps="${game.isHundredJumps || false}">
                    <span class="game-icon">${game.icon}</span>
                    <h3 class="game-title">${game.name}</h3>
                    <div class="game-date">${formatDate(game.date)}</div>
                    ${createStarRating(game.id, rating)}
                    <button class="play-btn" onclick="playGame('${folderName}')">Play</button>
                </div>
            `;
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Play game (placeholder)
        function playGame(folderName) {
            alert(`Launching: ${folderName}/index.html`);
            // In real implementation: window.location.href = `./${folderName}/index.html`;
        }

        // Filter and render games
        function renderGames() {
            const hundredJumpsGames = games.filter(g => g.isHundredJumps);
            const februaryGames = games.filter(g => g.month === 'february' && !g.isHundredJumps);
            const marchGames = games.filter(g => g.month === 'march' && !g.isHundredJumps);

            // Update counts
            document.getElementById('hundredJumpsCount').textContent = hundredJumpsGames.length;
            document.getElementById('februaryCount').textContent = februaryGames.length;
            document.getElementById('marchCount').textContent = marchGames.length;

            // Render grids
            document.getElementById('hundredJumpsGrid').innerHTML = hundredJumpsGames.map(createGameCard).join('') || '<div class="no-results"><div class="no-results-icon">📭</div>No games found</div>';
            document.getElementById('februaryGrid').innerHTML = februaryGames.map(createGameCard).join('') || '<div class="no-results"><div class="no-results-icon">📭</div>No games found</div>';
            document.getElementById('marchGrid').innerHTML = marchGames.map(createGameCard).join('') || '<div class="no-results"><div class="no-results-icon">📭</div>No games found</div>';

            // Apply filters
            applyFilters();
        }

        // Apply current filters
        function applyFilters() {
            const cards = document.querySelectorAll('.game-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const name = card.dataset.name;
                const month = card.dataset.month;
                const isRated = card.dataset.rated === 'true';
                const isHundredJumps = card.dataset.hundredjumps === 'true';

                // Search filter
                const matchesSearch = name.includes(searchQuery.toLowerCase());

                // Category filter
                let matchesFilter = true;
                switch (currentFilter) {
                    case 'rated':
                        matchesFilter = isRated;
                        break;
                    case 'unrated':
                        matchesFilter = !isRated;
                        break;
                    case '100jumps':
                        matchesFilter = isHundredJumps;
                        break;
                    case 'february':
                        matchesFilter = month === 'february';
                        break;
                    case 'march':
                        matchesFilter = month === 'march';
                        break;
                    default:
                        matchesFilter = true;
                }

                if (matchesSearch && matchesFilter) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            // Show/hide section headers based on visible cards
            document.querySelectorAll('.section-header').forEach(header => {
                const grid = header.nextElementSibling;
                const visibleCards = grid.querySelectorAll('.game-card:not(.hidden)');
                header.style.display = visibleCards.length > 0 ? 'flex' : 'none';
                grid.style.display = visibleCards.length > 0 ? 'grid' : 'none';
            });
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Search handler
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            applyFilters();
        });

        // Scroll to top button
        const scrollTopBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderGames();
            updateStats();
        });
    </script>
