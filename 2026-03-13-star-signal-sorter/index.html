<!doctype html><html lang='es'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Star Signal Sorter</title><style>body{font-family:Inter,Segoe UI,Arial;background:#070b1e;color:#eaf1ff;margin:0}.wrap{max-width:920px;margin:auto;padding:20px}.card{background:#111936;border:1px solid #304a8a;border-radius:16px;padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#17244f;padding:6px 10px;border-radius:999px;font-size:12px}.signal{flex:1;min-width:180px;background:#0e1735;border:1px solid #294280;border-radius:12px;padding:10px}.btn{background:#6ea8ff;color:#02122f;border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer} .muted{color:#9fb3e2}.ok{color:#7cffb2}.bad{color:#ff8f98}</style></head><body><div class='wrap'><div class='card'><h1>Star Signal Sorter</h1><p>Instrucciones: pulsa <b>Sort Round</b> para ordenar 4 señales de menor a mayor rating (1-5). Tienes 6 rondas y 2 errores máximos.</p><div class='row'><div class='chip'>Score: <span id='score'>0</span></div><div class='chip'>Round: <span id='round'>1</span>/6</div><div class='chip'>Errors: <span id='errors'>0</span>/2</div><div class='chip'>Badge: <span id='badge'>None</span></div></div><br/><div id='board' class='row'></div><br/><button class='btn' id='sortBtn'>Sort Round</button> <button class='btn' id='newBtn'>New Run</button> <p id='msg' class='muted'>Feedback inmediato aquí.</p><p id='state' class='muted'></p></div></div><script>let round=1,score=0,errors=0,done=false; const maxR=6; let vals=[]; const board=document.getElementById('board'); const m=document.getElementById('msg'); const s=document.getElementById('state'); function badge(){if(score>=90)return'Nova Crown'; if(score>=60)return'Comet Pro'; if(score>=35)return'Star Rookie'; return'None';} function gen(){vals=[...Array(4)].map(_=>1+Math.floor(Math.random()*5)); board.innerHTML=''; vals.forEach((v,i)=>{const d=document.createElement('div'); d.className='signal'; d.innerHTML=`<b>Signal ${i+1}</b><br/>Rating: <span data-v='${v}'>?</span>`; d.onclick=()=>{const sp=d.querySelector('span'); sp.textContent=sp.textContent==='?'?v:'?';}; board.appendChild(d);});} function sync(){scoreEl.textContent=score; roundEl.textContent=round; errorsEl.textContent=errors; badgeEl.textContent=badge();} const scoreEl=document.getElementById('score'),roundEl=document.getElementById('round'),errorsEl=document.getElementById('errors'),badgeEl=document.getElementById('badge'); document.getElementById('sortBtn').onclick=()=>{if(done)return; const guess=[...board.querySelectorAll('span')].map(x=>x.textContent==='?'?null:+x.textContent); if(guess.includes(null)){m.innerHTML='<span class="bad">Revela los 4 ratings antes de validar.</span>';return;} const ok=guess.every((v,i,a)=>i===0||a[i-1]<=v); if(ok){const gain=10+Math.max(0,6-round)*2; score+=gain; m.innerHTML=`<span class="ok">Perfect sort +${gain}</span>`;} else {errors++; score=Math.max(0,score-6); m.innerHTML='<span class="bad">Orden incorrecto -6.</span>';} if(errors>=2){done=true; s.innerHTML='<span class="bad"><b>GAME OVER</b></span> · Te quedaste sin margen. Badge final: '+badge();} else if(round>=maxR){done=true; s.innerHTML='<span class="ok"><b>WIN</b></span> · Run completada. Badge: '+badge();} else {round++; gen();} sync();}; document.getElementById('newBtn').onclick=()=>{round=1;score=0;errors=0;done=false;s.textContent='';m.textContent='Nueva run iniciada.';gen();sync();}; gen();sync();</script></body></html>
