<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Lane Reactor</title>
<style>
:root{--bg:#0b0616;--panel:#1a1130;--line:#4b2f76;--txt:#f4edff;--pri:#db2777;--acc:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2a1343,var(--bg));color:var(--txt);font-family:Inter,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:320px;margin:10px 0}.lane{position:relative;background:#120c24;border:1px solid #55378a;border-radius:10px;overflow:hidden}
.note{position:absolute;left:12%;width:76%;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--pri),var(--acc));}
.hit{position:absolute;bottom:10px;left:8%;width:84%;height:24px;border:2px dashed #f8b4d0;border-radius:8px}
kbd{background:#2a1b45;padding:3px 8px;border-radius:7px;border:1px solid #6a45aa}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--pri),var(--acc));color:#200812}.ghost{background:#170f2c;color:#f7eeff;border:1px solid #5b3994}
</style></head><body><div class="wrap"><div class="card">
<span>Rhythm challenge · 60s</span><h1>Rhythm Lane Reactor</h1>
<p>Instructions: press <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> when notes hit the dashed zone. Perfect timing gives combo bonus. Misses cost lives.</p>
<div class="row"><span>Tiempo: <b id="time">60</b>s</span><span>Score: <b id="score">0</b></span><span>Combo: <b id="combo">0</b></span><span>Lives: <b id="lives">10</b></span><span>Badge: <b id="badge">-</b></span></div>
<div class="lanes" id="lanes"></div>
<div class="row"><button class="btn primary" id="start">Start Run</button><button class="btn ghost" onclick="location.reload()">Restart</button><a class="btn ghost" href="./report.html">Ver report</a></div>
<p id="msg">Immediate feedback: PERFECT (+12), GOOD (+8), MISS (-life).</p><div id="end"></div>
</div></div>
<script>
const keys=['a','s','d','f'];const lanesEl=document.getElementById('lanes');
for(let i=0;i<4;i++){const lane=document.createElement('div');lane.className='lane';lane.dataset.i=i;lane.innerHTML='<div class="hit"></div>';lanesEl.appendChild(lane)}
let notes=[],run=false,score=0,combo=0,lives=10,time=60,tickHandle,spawnHandle;
function upd(){document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo;document.getElementById('lives').textContent=lives;document.getElementById('time').textContent=time;document.getElementById('badge').textContent=score>=320?'Neon Maestro 🏆':score>=220?'Pulse Pro 🥈':score>=130?'Beat Rookie 🥉':'-';}
function spawn(){if(!run)return;const lane=Math.floor(Math.random()*4);const el=document.createElement('div');el.className='note';el.style.top='0px';el.dataset.lane=lane;lanesEl.children[lane].appendChild(el);notes.push({el,lane,y:0,hit:false});}
function step(){if(!run)return;for(const n of notes){n.y+=4;n.el.style.top=n.y+'px';if(n.y>292 && !n.hit){lives--;combo=0;n.hit=true;n.el.remove();document.getElementById('msg').textContent='MISS ❌';}}
notes=notes.filter(n=>!n.hit);if(lives<=0){finish(false);}upd();requestAnimationFrame(step);} 
function keypress(k){if(!run)return;const lane=keys.indexOf(k.toLowerCase());if(lane<0)return;let target=notes.find(n=>n.lane===lane && !n.hit && n.y>250 && n.y<296);
if(!target){lives--;combo=0;document.getElementById('msg').textContent='MISS key ❌';upd();if(lives<=0)finish(false);return;}
const delta=Math.abs(272-target.y);target.hit=true;target.el.remove();if(delta<8){score+=12+Math.min(8,combo);combo++;document.getElementById('msg').textContent='PERFECT ✅';}
else {score+=8;combo=Math.max(0,combo-1);document.getElementById('msg').textContent='GOOD ✔️';} upd();}
function finish(win){run=false;clearInterval(tickHandle);clearInterval(spawnHandle);document.getElementById('end').innerHTML=`<div class='card' style='margin-top:12px'><h2>${win?'YOU WIN':'GAME OVER'}</h2><p>Final score: <b>${score}</b>. Badge: <b>${score>=320?'Neon Maestro 🏆':score>=220?'Pulse Pro 🥈':score>=130?'Beat Rookie 🥉':'No badge'}</b></p></div>`;}
document.getElementById('start').onclick=()=>{if(run)return;run=true;score=0;combo=0;lives=10;time=60;upd();document.getElementById('msg').textContent='Run started. Keep rhythm!';spawnHandle=setInterval(spawn,650);tickHandle=setInterval(()=>{time--;upd();if(time<=0)finish(score>=130);},1000);requestAnimationFrame(step);} 
window.addEventListener('keydown',(e)=>keypress(e.key));upd();
</script></body></html>
