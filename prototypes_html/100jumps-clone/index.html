<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100 Jumps - Clone Exacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            background: #0f0f1a;
            overflow: hidden;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ui-overlay.interactive {
            pointer-events: auto;
        }
        .instructions {
            position: absolute;
            top: 20%;
            text-align: center;
            color: white;
            animation: fadeOut 3s forwards;
            animation-delay: 3s;
        }
        .instructions h2 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .instructions p {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            opacity: 0.8;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        .game-over, .win-screen {
            background: rgba(15, 15, 26, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .game-over h1, .win-screen h1 {
            color: #ff5b78;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .win-screen h1 {
            color: #24c78b;
        }
        .game-over p, .win-screen p {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .hidden {
            display: none !important;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .hud-left, .hud-right {
            display: flex;
            gap: 20px;
        }
        .lives {
            color: #ff5b78;
        }
        .jumps {
            color: #6366f1;
        }
        .perfect-streak {
            color: #24c78b;
        }
        .mute-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .mute-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        /* Charge bar */
        .charge-bar-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .charge-bar-container.visible {
            opacity: 1;
        }
        .charge-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #24c78b 0%, #fbbf24 50%, #ef4444 100%);
            border-radius: 4px;
            transition: width 0.05s linear;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="hud" id="hud">
        <div class="hud-left">
            <div class="jumps">Jumps: <span id="jumpCount">0</span>/100</div>
            <div class="perfect-streak">Streak: <span id="streakCount">0</span>/3</div>
        </div>
        <div class="hud-right">
            <div class="lives">❤️ <span id="livesCount">3</span></div>
        </div>
    </div>
    
    <div class="instructions" id="instructions">
        <h2>HOLD to Charge • RELEASE to Jump</h2>
        <p>Land in the CENTER for PERFECT (+1 life every 3)</p>
    </div>
    
    <div class="charge-bar-container" id="chargeBarContainer">
        <div class="charge-bar" id="chargeBar"></div>
    </div>
    
    <div class="ui-overlay interactive hidden" id="gameOverScreen">
        <div class="game-over">
            <h1>GAME OVER</h1>
            <p>You fell after <span id="finalJumps">0</span> jumps</p>
            <p>Best: <span id="bestJumps">0</span> jumps</p>
            <button class="btn" onclick="game.restart()">TRY AGAIN</button>
        </div>
    </div>
    
    <div class="ui-overlay interactive hidden" id="winScreen">
        <div class="win-screen">
            <h1>🏆 CHAMPION!</h1>
            <p>You completed 100 JUMPS!</p>
            <p>Attempts: <span id="attemptsCount">1</span></p>
            <button class="btn" onclick="game.restart()">PLAY AGAIN</button>
        </div>
    </div>
    
    <button class="mute-btn" id="muteBtn" onclick="game.toggleMute()">🔊</button>

    <script>
        // Web Audio API Synthesizer
        class AudioSynth {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.muted = false;
            }
            
            playJump() {
                if (this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.1);
                osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
                this.vibrate(10);
            }
            
            playLand() {
                if (this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
                this.vibrate(12);
            }
            
            playPerfect() {
                if (this.muted) return;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.05);
                    gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + i * 0.05 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.05 + 0.3);
                    osc.start(this.ctx.currentTime + i * 0.05);
                    osc.stop(this.ctx.currentTime + i * 0.05 + 0.3);
                });
                this.vibrate([12, 30, 12]);
            }
            
            playLifeGain() {
                if (this.muted) return;
                [659.25, 830.61, 987.77, 830.61, 987.77].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.08);
                    gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + i * 0.08 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.4);
                    osc.start(this.ctx.currentTime + i * 0.08);
                    osc.stop(this.ctx.currentTime + i * 0.08 + 0.4);
                });
                this.vibrate([15, 30, 15, 30, 25]);
            }
            
            playGameOver() {
                if (this.muted) return;
                [440, 415, 392, 370, 349].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.15 + 0.2);
                    osc.start(this.ctx.currentTime + i * 0.15);
                    osc.stop(this.ctx.currentTime + i * 0.15 + 0.2);
                });
                this.vibrate(120);
            }
            
            playWin() {
                if (this.muted) return;
                [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + i * 0.1 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.4);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + i * 0.1 + 0.4);
                });
            }
            
            vibrate(pattern) {
                if (navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            }
        }

        // Particle System
        class Particle {
            constructor(x, y, color, speed = 1) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4 * speed;
                this.vy = (Math.random() - 0.5) * 4 * speed - 2;
                this.life = 1;
                this.decay = 0.02 + Math.random() * 0.02;
                this.color = color;
                this.size = 3 + Math.random() * 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Floating Text
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1;
                this.vy = -2;
            }
            update() {
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // Game State
        const STATE = {
            IDLE: 'idle',
            CHARGING: 'charging',
            JUMPING: 'jumping',
            GAME_OVER: 'game_over',
            WIN: 'win'
        };

        // Constants for physics
        const CONSTANTS = {
            GRAVITY: 0.4,
            MIN_JUMP_POWER: 7,
            MAX_JUMP_POWER: 16,
            MAX_CHARGE_TIME: 800, // ms to reach max power
            ANGLE: -Math.PI / 4, // 45 degrees upward
            PLATFORM_HEIGHT: 15,
            PLAYER_SIZE: 30,
            PERFECT_ZONE_RATIO: 0.2, // 20% of platform width
            VIEW_AHEAD: 3 // platforms to render ahead
        };

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = new AudioSynth();
                this.resize();
                
                this.state = STATE.IDLE;
                this.jumps = 0;
                this.lives = 3;
                this.perfectStreak = 0;
                this.attempts = 1;
                this.bestJumps = parseInt(localStorage.getItem('bestJumps') || '0');
                this.muted = false;
                
                this.camera = { x: 0, y: 0 };
                this.platforms = [];
                this.particles = [];
                this.floatingTexts = [];
                
                this.player = {
                    x: 0, y: 0,
                    vx: 0, vy: 0,
                    width: CONSTANTS.PLAYER_SIZE, 
                    height: CONSTANTS.PLAYER_SIZE,
                    onGround: false,
                    scaleX: 1, scaleY: 1
                };
                
                this.charging = false;
                this.chargeStartTime = 0;
                this.chargeRatio = 0;
                this.currentPlatformIndex = 0;
                this.highestGeneratedIndex = 0;
                
                this.setupInputs();
                this.initGame();
                this.loop();
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.dpr = Math.min(window.devicePixelRatio || 1, 2);
                this.canvas.style.width = window.innerWidth + 'px';
                this.canvas.style.height = window.innerHeight + 'px';
                this.ctx.scale(this.dpr, this.dpr);
            }
            
            initGame() {
                this.platforms = [];
                this.currentPlatformIndex = 0;
                this.highestGeneratedIndex = 0;
                
                // Create starting platform
                const startY = this.canvas.height / this.dpr - 200;
                this.platforms.push({
                    x: 50,
                    y: startY,
                    width: 120,
                    height: CONSTANTS.PLATFORM_HEIGHT
                });
                
                // Generate first few platforms
                this.generatePlatformsAhead(5);
                this.resetPlayer();
            }
            
            generatePlatformsAhead(count) {
                let lastPlat = this.platforms[this.platforms.length - 1];
                
                for (let i = 0; i < count; i++) {
                    const jumpNum = this.platforms.length;
                    const tier = this.getTier(jumpNum);
                    
                    // Random gap and width based on tier
                    const gap = tier.minGap + Math.random() * (tier.maxGap - tier.minGap);
                    const width = tier.minWidth + Math.random() * (tier.maxWidth - tier.minWidth);
                    
                    // Y variation (height difference between platforms)
                    const maxYOffset = Math.min(120, jumpNum * 2); // increases with difficulty
                    const yOffset = (Math.random() - 0.5) * maxYOffset * 2;
                    
                    let newY = lastPlat.y + yOffset;
                    // Keep within reasonable bounds
                    newY = Math.max(150, Math.min(this.canvas.height / this.dpr - 150, newY));
                    
                    const newPlat = {
                        x: lastPlat.x + lastPlat.width + gap,
                        y: newY,
                        width: width,
                        height: CONSTANTS.PLATFORM_HEIGHT
                    };
                    
                    this.platforms.push(newPlat);
                    lastPlat = newPlat;
                }
                
                this.highestGeneratedIndex = this.platforms.length - 1;
            }
            
            getTier(jumpNum) {
                if (jumpNum <= 5) return { minGap: 80, maxGap: 130, minWidth: 100, maxWidth: 130 };
                if (jumpNum <= 15) return { minGap: 100, maxGap: 170, minWidth: 80, maxWidth: 110 };
                if (jumpNum <= 35) return { minGap: 120, maxGap: 200, minWidth: 65, maxWidth: 95 };
                if (jumpNum <= 60) return { minGap: 140, maxGap: 240, minWidth: 50, maxWidth: 80 };
                if (jumpNum <= 85) return { minGap: 160, maxGap: 280, minWidth: 40, maxWidth: 65 };
                return { minGap: 180, maxGap: 320, minWidth: 35, maxWidth: 55 };
            }
            
            resetPlayer() {
                const start = this.platforms[0];
                this.player.x = start.x + start.width / 2 - this.player.width / 2;
                this.player.y = start.y - this.player.height;
                this.player.vx = 0;
                this.player.vy = 0;
                this.player.onGround = true;
                this.player.scaleX = 1;
                this.player.scaleY = 1;
                this.currentPlatformIndex = 0;
            }
            
            setupInputs() {
                const startCharge = (e) => {
                    if (this.state !== STATE.IDLE || !this.player.onGround) return;
                    e.preventDefault();
                    this.charging = true;
                    this.chargeStartTime = Date.now();
                    this.chargeRatio = 0;
                    this.state = STATE.CHARGING;
                    
                    document.getElementById('chargeBarContainer').classList.add('visible');
                    
                    if (this.audio.ctx.state === 'suspended') {
                        this.audio.ctx.resume();
                    }
                };
                
                const endCharge = (e) => {
                    if (!this.charging || this.state !== STATE.CHARGING) return;
                    e.preventDefault();
                    this.charging = false;
                    document.getElementById('chargeBarContainer').classList.remove('visible');
                    this.jump();
                };
                
                this.canvas.addEventListener('mousedown', startCharge);
                this.canvas.addEventListener('mouseup', endCharge);
                this.canvas.addEventListener('touchstart', startCharge, { passive: false });
                this.canvas.addEventListener('touchend', endCharge, { passive: false });
                
                window.addEventListener('keydown', (e) => {
                    if (e.repeat) return;
                    if (e.code === 'Space' || e.key === ' ') {
                        startCharge(e);
                    }
                });
                
                window.addEventListener('keyup', (e) => {
                    if (e.code === 'Space' || e.key === ' ') {
                        endCharge(e);
                    }
                });
                
                window.addEventListener('resize', () => {
                    this.resize();
                    // Adjust player if off screen after resize
                    if (this.player.y > this.canvas.height / this.dpr - 100) {
                        const plat = this.platforms[this.currentPlatformIndex];
                        this.player.y = plat.y - this.player.height;
                    }
                });
            }
            
            jump() {
                const chargeTime = Date.now() - this.chargeStartTime;
                // Charge ratio from 0 to 1
                const rawRatio = Math.min(chargeTime / CONSTANTS.MAX_CHARGE_TIME, 1);
                
                // Ensure minimum jump (even for very short presses)
                this.chargeRatio = Math.max(0.15, rawRatio);
                
                this.audio.playJump();
                
                // Calculate jump velocity based on charge
                const jumpPower = CONSTANTS.MIN_JUMP_POWER + 
                    this.chargeRatio * (CONSTANTS.MAX_JUMP_POWER - CONSTANTS.MIN_JUMP_POWER);
                
                // Parabolic jump physics - power determines distance
                this.player.vx = Math.cos(CONSTANTS.ANGLE) * jumpPower;
                this.player.vy = Math.sin(CONSTANTS.ANGLE) * jumpPower;
                this.player.onGround = false;
                this.state = STATE.JUMPING;
                
                // Squash effect on jump
                this.player.scaleX = 0.7;
                this.player.scaleY = 1.3;
            }
            
            update() {
                // Update particles
                this.particles = this.particles.filter(p => {
                    p.update();
                    return p.life > 0;
                });
                
                // Update floating texts
                this.floatingTexts = this.floatingTexts.filter(t => {
                    t.update();
                    return t.life > 0;
                });
                
                // Update charge bar if charging
                if (this.state === STATE.CHARGING) {
                    const chargeTime = Date.now() - this.chargeStartTime;
                    const ratio = Math.min(chargeTime / CONSTANTS.MAX_CHARGE_TIME, 1);
                    document.getElementById('chargeBar').style.width = (ratio * 100) + '%';
                    
                    // Squash animation while charging
                    this.player.scaleX = 1 + ratio * 0.4;
                    this.player.scaleY = 1 - ratio * 0.3;
                }
                
                // Player physics when jumping
                if (this.state === STATE.JUMPING) {
                    // Apply gravity
                    this.player.vy += CONSTANTS.GRAVITY;
                    
                    // Update position
                    this.player.x += this.player.vx;
                    this.player.y += this.player.vy;
                    
                    // Stretch effect based on velocity
                    const stretch = Math.min(Math.abs(this.player.vy) * 0.03, 0.3);
                    this.player.scaleX = 0.9 - stretch;
                    this.player.scaleY = 1.1 + stretch;
                    
                    // Check for landing
                    this.checkLanding();
                    
                    // Check for fall (game over)
                    if (this.player.y > this.canvas.height / this.dpr + 100) {
                        this.gameOver();
                    }
                }
                
                // Smooth return to normal scale
                if (this.state !== STATE.CHARGING) {
                    this.player.scaleX += (1 - this.player.scaleX) * 0.15;
                    this.player.scaleY += (1 - this.player.scaleY) * 0.15;
                }
                
                // Camera follow player
                const targetCamX = this.player.x - this.canvas.width / this.dpr / 3;
                this.camera.x += (targetCamX - this.camera.x) * 0.1;
                this.camera.x = Math.max(0, this.camera.x);
                
                // Generate more platforms if needed
                this.managePlatformGeneration();
                
                // Update HUD
                document.getElementById('jumpCount').textContent = this.jumps;
                document.getElementById('livesCount').textContent = this.lives;
                document.getElementById('streakCount').textContent = this.perfectStreak;
            }
            
            managePlatformGeneration() {
                const visibleAhead = this.currentPlatformIndex + CONSTANTS.VIEW_AHEAD * 2;
                if (visibleAhead >= this.highestGeneratedIndex && this.platforms.length < 105) {
                    this.generatePlatformsAhead(3);
                }
            }
            
            checkLanding() {
                // Only check when falling down
                if (this.player.vy < 0) return;
                
                const playerCenterX = this.player.x + this.player.width / 2;
                const playerBottomY = this.player.y + this.player.height;
                
                // Check against the next few platforms
                for (let i = this.currentPlatformIndex; i < Math.min(this.platforms.length, this.currentPlatformIndex + 3); i++) {
                    const plat = this.platforms[i];
                    
                    // Check horizontal overlap
                    if (playerCenterX >= plat.x && playerCenterX <= plat.x + plat.width) {
                        // Check vertical landing (player falling onto platform)
                        if (playerBottomY >= plat.y && 
                            playerBottomY <= plat.y + plat.height + 15 &&
                            this.player.vy > 0) {
                            
                            this.land(plat, i);
                            return;
                        }
                    }
                }
            }
            
            land(platform, platformIndex) {
                // Snap to platform top
                this.player.y = platform.y - this.player.height;
                this.player.vx = 0;
                this.player.vy = 0;
                this.player.onGround = true;
                
                // Only count jump if landing on a new platform
                if (platformIndex > this.currentPlatformIndex) {
                    this.currentPlatformIndex = platformIndex;
                    this.jumps++;
                    
                    // Check landing quality
                    const playerCenterX = this.player.x + this.player.width / 2;
                    const platformCenterX = platform.x + platform.width / 2;
                    const perfectZoneHalfWidth = (platform.width * CONSTANTS.PERFECT_ZONE_RATIO) / 2;
                    
                    const isPerfect = Math.abs(playerCenterX - platformCenterX) <= perfectZoneHalfWidth;
                    
                    if (isPerfect) {
                        this.perfectStreak++;
                        this.audio.playPerfect();
                        this.spawnParticles(playerCenterX, this.player.y + this.player.height, '#24c78b', 1.5);
                        this.floatingTexts.push(new FloatingText(
                            playerCenterX - this.camera.x,
                            this.player.y - 30,
                            'PERFECT!',
                            '#24c78b'
                        ));
                        
                        // Life gain every 3 perfects
                        if (this.perfectStreak >= 3) {
                            this.lives++;
                            this.perfectStreak = 0;
                            this.audio.playLifeGain();
                            this.floatingTexts.push(new FloatingText(
                                playerCenterX - this.camera.x,
                                this.player.y - 60,
                                '+1 LIFE!',
                                '#ff5b78'
                            ));
                        }
                    } else {
                        this.perfectStreak = 0;
                        this.audio.playLand();
                        this.spawnParticles(playerCenterX, this.player.y + this.player.height, '#9aa8bd');
                    }
                    
                    // Check win condition
                    if (this.jumps >= 100) {
                        this.win();
                        return;
                    }
                }
                
                // Bounce effect on landing
                this.player.scaleX = 1.15;
                this.player.scaleY = 0.85;
                
                this.state = STATE.IDLE;
            }
            
            spawnParticles(x, y, color, speed = 1) {
                for (let i = 0; i < 12; i++) {
                    this.particles.push(new Particle(x, y, color, speed));
                }
            }
            
            gameOver() {
                this.state = STATE.GAME_OVER;
                this.audio.playGameOver();
                
                if (this.jumps > this.bestJumps) {
                    this.bestJumps = this.jumps;
                    localStorage.setItem('bestJumps', this.bestJumps);
                }
                
                document.getElementById('finalJumps').textContent = this.jumps;
                document.getElementById('bestJumps').textContent = this.bestJumps;
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('chargeBarContainer').classList.remove('visible');
            }
            
            win() {
                this.state = STATE.WIN;
                this.audio.playWin();
                document.getElementById('attemptsCount').textContent = this.attempts;
                document.getElementById('winScreen').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('chargeBarContainer').classList.remove('visible');
            }
            
            restart() {
                this.jumps = 0;
                this.lives = 3;
                this.perfectStreak = 0;
                this.attempts++;
                this.state = STATE.IDLE;
                this.charging = false;
                this.particles = [];
                this.floatingTexts = [];
                this.chargeRatio = 0;
                
                this.camera.x = 0;
                this.initGame();
                
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('winScreen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('chargeBarContainer').classList.remove('visible');
                document.getElementById('chargeBar').style.width = '0%';
                
                // Reset instructions animation
                const instr = document.getElementById('instructions');
                instr.style.animation = 'none';
                instr.style.opacity = '1';
                setTimeout(() => {
                    instr.style.animation = 'fadeOut 3s forwards';
                    instr.style.animationDelay = '3s';
                }, 10);
            }
            
            toggleMute() {
                this.muted = !this.muted;
                this.audio.muted = this.muted;
                document.getElementById('muteBtn').textContent = this.muted ? '🔇' : '🔊';
            }
            
            draw() {
                // Clear background
                this.ctx.fillStyle = '#0f0f1a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Background gradient
                const grad = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                grad.addColorStop(0, '#1a1a2e');
                grad.addColorStop(1, '#0f0f1a');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.save();
                this.ctx.translate(-this.camera.x, 0);
                
                // Draw only visible platforms (optimization)
                const visibleStart = Math.max(0, this.currentPlatformIndex - 1);
                const visibleEnd = Math.min(this.platforms.length, this.currentPlatformIndex + CONSTANTS.VIEW_AHEAD + 2);
                
                for (let i = visibleStart; i < visibleEnd; i++) {
                    const plat = this.platforms[i];
                    
                    // Skip if off-screen
                    if (plat.x - this.camera.x > this.canvas.width / this.dpr) continue;
                    if (plat.x + plat.width - this.camera.x < 0) continue;
                    
                    // Platform body
                    this.ctx.fillStyle = '#3a3a5a';
                    this.ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    
                    // Perfect zone (center 20%)
                    const perfectWidth = plat.width * CONSTANTS.PERFECT_ZONE_RATIO;
                    const perfectX = plat.x + (plat.width - perfectWidth) / 2;
                    
                    // Highlight perfect zone on next platform
                    if (i === this.currentPlatformIndex + 1) {
                        this.ctx.fillStyle = 'rgba(36, 199, 139, 0.4)';
                    } else if (i === this.currentPlatformIndex) {
                        this.ctx.fillStyle = 'rgba(36, 199, 139, 0.2)';
                    } else {
                        this.ctx.fillStyle = 'rgba(36, 199, 139, 0.1)';
                    }
                    this.ctx.fillRect(perfectX, plat.y, perfectWidth, plat.height);
                    
                    // Platform top highlight
                    this.ctx.fillStyle = '#5a5a7a';
                    this.ctx.fillRect(plat.x, plat.y, plat.width, 2);
                }
                
                // Draw player
                this.ctx.save();
                this.ctx.translate(
                    this.player.x + this.player.width / 2, 
                    this.player.y + this.player.height / 2
                );
                this.ctx.scale(this.player.scaleX, this.player.scaleY);
                
                // Player body
                this.ctx.fillStyle = '#6366f1';
                this.roundRect(-this.player.width / 2, -this.player.height / 2, 
                    this.player.width, this.player.height, 6);
                this.ctx.fill();
                
                // Eyes
                this.ctx.fillStyle = 'white';
                this.ctx.beginPath();
                this.ctx.arc(-6, -2, 5, 0, Math.PI * 2);
                this.ctx.arc(6, -2, 5, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Pupils (look in direction of movement)
                this.ctx.fillStyle = 'black';
                const lookDir = this.player.vx >= 0 ? 1 : -1;
                this.ctx.beginPath();
                this.ctx.arc(-6 + lookDir * 2, -2, 2.5, 0, Math.PI * 2);
                this.ctx.arc(6 + lookDir * 2, -2, 2.5, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Charging indicator arc
                if (this.state === STATE.CHARGING) {
                    const chargeTime = Date.now() - this.chargeStartTime;
                    const ratio = Math.min(chargeTime / CONSTANTS.MAX_CHARGE_TIME, 1);
                    
                    this.ctx.strokeStyle = ratio < 0.5 ? '#24c78b' : ratio < 0.8 ? '#fbbf24' : '#ef4444';
                    this.ctx.lineWidth = 4;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 28, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
                    this.ctx.stroke();
                }
                
                this.ctx.restore(); // End player transform
                this.ctx.restore(); // End camera transform
                
                // Draw particles (world space, but handle camera)
                this.ctx.save();
                this.ctx.translate(-this.camera.x, 0);
                this.particles.forEach(p => p.draw(this.ctx));
                this.ctx.restore();
                
                // Draw floating texts (screen space)
                this.floatingTexts.forEach(t => {
                    const screenX = t.x; // Already in screen coords
                    const screenY = t.y;
                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, t.life);
                    this.ctx.fillStyle = t.color;
                    this.ctx.font = 'bold 24px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(t.text, screenX, screenY);
                    this.ctx.restore();
                });
            }
            
            roundRect(x, y, w, h, r) {
                this.ctx.beginPath();
                this.ctx.moveTo(x + r, y);
                this.ctx.lineTo(x + w - r, y);
                this.ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                this.ctx.lineTo(x + w, y + h - r);
                this.ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.ctx.lineTo(x + r, y + h);
                this.ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                this.ctx.lineTo(x, y + r);
                this.ctx.quadraticCurveTo(x, y, x + r, y);
                this.ctx.closePath();
            }
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        // Start game
        const game = new Game();
    </script>
</body>
