<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parse Pulse Daily</title><style>body{margin:0;background:#0a1022;color:#e7eeff;font-family:Inter,Segoe UI,Arial}main{max-width:920px;margin:auto;padding:18px}.card{background:#131d3f;border:1px solid #2d4178;border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.token{padding:10px 12px;border-radius:10px;background:#1d2a56;border:1px solid #415ea3;cursor:pointer}.token.used{opacity:.35;pointer-events:none}.slot{min-width:52px;min-height:40px;border:1px dashed #5c77b8;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#111b38}.good{border-color:#40d48b!important;box-shadow:0 0 0 2px #40d48b33}.bad{border-color:#ff6b81!important}.btn{background:#7ca5ff;border:none;color:#08112b;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.pill{padding:4px 8px;border-radius:999px;background:#24366c;font-size:12px}.hide{display:none}</style></head><body><main><h1>Parse Pulse Daily</h1><p>Build valid 3-word command phrases before time runs out. <b>Win:</b> 4 correct commands. <b>Game over:</b> 3 mistakes or timer zero.</p><div class="card row"><div class="pill" id="score">Score: 0</div><div class="pill" id="lives">Lives: 3</div><div class="pill" id="timer">Time: 75</div><div class="pill" id="streak">Streak: 0</div><div class="pill" id="badge">Badge: Rookie Parser</div></div><div class="card"><h3 id="prompt"></h3><div id="slots" class="row"></div><p id="feedback"></p></div><div class="card"><div id="tokens" class="row"></div><div class="row" style="margin-top:10px"><button class="btn" id="submit">Submit phrase</button><button class="btn" id="clear">Clear</button><button class="btn hide" id="restart">Play again</button></div></div></main><script>
const rounds=[{rule:'Set color filter',target:['SET','BLUE','FILTER'],pool:['SET','BLUE','FILTER','CLEAR','RED','MODE']},{rule:'Launch daily mission',target:['START','DAILY','RUN'],pool:['START','DAILY','RUN','STOP','WEEKLY','JUMP']},{rule:'Lock score boost',target:['LOCK','SCORE','BOOST'],pool:['LOCK','SCORE','BOOST','DROP','SLOW','MUTE']},{rule:'Find hidden clue',target:['SCAN','SECRET','WORD'],pool:['SCAN','SECRET','WORD','SORT','PUBLIC','TILE']},{rule:'Activate streak mode',target:['ACTIVATE','STREAK','MODE'],pool:['ACTIVATE','STREAK','MODE','DELETE','PAUSE','BOARD']},{rule:'Open reward chest',target:['OPEN','REWARD','CHEST'],pool:['OPEN','REWARD','CHEST','CLOSE','EMPTY','BOX']}];
let i=0,score=0,lives=3,time=75,streak=0,selected=[]; let over=false; const el=id=>document.getElementById(id);
function badge(){if(score>=160)return'Pulse Master';if(score>=100)return'Gold Parser';if(score>=50)return'Silver Parser';return'Rookie Parser'}
function renderRound(){if(i>=rounds.length||score>=160)return win(); const r=rounds[i]; el('prompt').textContent=`Goal: ${r.rule}`; el('slots').innerHTML='<div class="slot"></div><div class="slot"></div><div class="slot"></div>'; selected=[]; const t=el('tokens'); t.innerHTML=''; [...r.pool].sort(()=>Math.random()-.5).forEach(w=>{const b=document.createElement('button');b.className='token';b.textContent=w;b.onclick=()=>pick(w,b);t.appendChild(b);});}
function pick(w,b){if(over||selected.length>=3)return; selected.push(w); b.classList.add('used'); const slots=[...document.querySelectorAll('.slot')]; slots[selected.length-1].textContent=w; slots[selected.length-1].classList.remove('bad','good');}
function clearSel(){selected=[]; document.querySelectorAll('.token').forEach(t=>t.classList.remove('used')); document.querySelectorAll('.slot').forEach(s=>{s.textContent='';s.classList.remove('bad','good')});}
function ui(msg=''){el('score').textContent=`Score: ${score}`;el('lives').textContent=`Lives: ${lives}`;el('timer').textContent=`Time: ${time}`;el('streak').textContent=`Streak: ${streak}`;el('badge').textContent=`Badge: ${badge()}`;el('feedback').textContent=msg;}
function submit(){if(selected.length!==3||over)return ui('Pick 3 words first.');const target=rounds[i].target.join('|'), got=selected.join('|'); const slots=[...document.querySelectorAll('.slot')]; if(got===target){streak++; score+=20+streak*4; slots.forEach(s=>s.classList.add('good')); ui('Perfect parse ✅ +points'); setTimeout(()=>{i++;renderRound();ui('Next command!')},450);} else {streak=0; lives--; score=Math.max(0,score-6); slots.forEach(s=>s.classList.add('bad')); ui('Wrong command ❌'); if(lives<=0)return lose('No lives left.'); setTimeout(clearSel,420);} }
function lose(msg){over=true; ui(`Game over: ${msg}`); el('restart').classList.remove('hide');}
function win(){over=true; ui('WIN! Daily parse completed 🏆'); el('restart').classList.remove('hide');}
el('submit').onclick=submit; el('clear').onclick=clearSel; el('restart').onclick=()=>location.reload(); renderRound(); ui('Build your first command.');
setInterval(()=>{if(over)return; time--; ui(); if(time<=0)lose('Time is up.');},1000);
</script></body></html>
